    <!-- XXXX楼栋-楼层（或者室外位置信息）弹窗 -->
    <div id="gis-overlay" onclick="closeGisMap()" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:10000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);"></div>
    <div id="gis-modal" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.9);opacity:0;z-index:10001;width:720px;background:#fff;border-radius:12px;display:flex;flex-direction:column;overflow:hidden;transition:all 0.25s ease;pointer-events:none;">
        <div style="height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #e5e7eb;flex-shrink:0;">
            <h3 style="font-size:16px;font-weight:600;color:#1f2937;">XXXX楼栋-楼层（或者室外位置信息）</h3>
            <span onclick="closeGisMap()" style="font-size:20px;cursor:pointer;color:#9ca3af;">&times;</span>
        </div>
        <div style="padding:16px 20px;flex:1;display:flex;flex-direction:column;">

            <div id="gis-map-container" onclick="placeGisMark(event)" style="position:relative;width:100%;height:360px;border-radius:8px;overflow:hidden;cursor:crosshair;background:linear-gradient(135deg,#1a2a3a 0%,#2a3f5f 50%,#1a2a3a 100%);">
                <!-- 2.5D GIS底图模拟 -->
                <div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(255,255,255,0.04) 40px),repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(255,255,255,0.04) 40px);"></div>
                <!-- 地形模拟 -->
                <div style="position:absolute;left:10%;top:15%;width:30%;height:40%;background:radial-gradient(ellipse at center,rgba(34,197,94,0.12),transparent 70%);"></div>
                <div style="position:absolute;right:5%;top:50%;width:35%;height:35%;background:radial-gradient(ellipse at center,rgba(59,130,246,0.1),transparent 70%);"></div>
                <div style="position:absolute;left:45%;top:55%;width:20%;height:25%;background:radial-gradient(ellipse at center,rgba(239,68,68,0.08),transparent 70%);"></div>
                <!-- 道路模拟 -->
                <div style="position:absolute;left:0;top:45%;width:100%;height:2px;background:rgba(255,255,255,0.1);transform:rotate(-5deg);"></div>
                <div style="position:absolute;left:30%;top:0;width:2px;height:100%;background:rgba(255,255,255,0.1);transform:rotate(8deg);"></div>
                <!-- 建筑模拟 -->
                <div style="position:absolute;left:15%;top:20%;width:40px;height:30px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:2px;transform:perspective(100px) rotateX(25deg);"></div>
                <div style="position:absolute;left:60%;top:30%;width:50px;height:35px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:2px;transform:perspective(100px) rotateX(25deg);"></div>
                <div style="position:absolute;left:25%;top:60%;width:45px;height:32px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:2px;transform:perspective(100px) rotateX(25deg);"></div>
                <div style="position:absolute;left:70%;top:65%;width:38px;height:28px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:2px;transform:perspective(100px) rotateX(25deg);"></div>
                <!-- 标签 -->
                <div style="position:absolute;left:12px;top:12px;font-size:11px;color:rgba(255,255,255,0.4);">矿区GIS底图 · 2.5D</div>
                <div style="position:absolute;right:12px;bottom:12px;font-size:11px;color:rgba(255,255,255,0.3);">比例尺 1:500</div>
                <!-- 标注点容器 -->
                <div id="gis-mark-point" style="display:none;position:absolute;transform:translate(-50%,-100%);z-index:10;">
                    <div style="width:24px;height:24px;background:#ef4444;border:3px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 8px rgba(0,0,0,0.4);"></div>
                    <div style="position:absolute;top:-22px;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(0,0,0,0.7);color:#fff;font-size:11px;padding:2px 8px;border-radius:4px;">标注点位</div>
                </div>

            <div id="gis-coord" style="font-size:12px;color:#6b7280;margin-top:8px;">坐标：未标注</div>

        <div style="padding:12px 20px;border-top:1px solid #e5e7eb;flex-shrink:0;display:flex;gap:12px;justify-content:flex-end;">
            <button onclick="closeGisMap()" style="padding:8px 20px;border:1px solid #d8dbe3;border-radius:6px;background:#fff;font-size:14px;cursor:pointer;color:#6b7280;">取消</button>
            <button onclick="saveGisMark()" style="padding:8px 20px;border:none;border-radius:6px;background:#2570f2;color:#fff;font-size:14px;cursor:pointer;">保存标注</button>
        </div>
    </div>

    <script>
        if (localStorage.getItem('annotationReviewCompletedRealtime') === 'true') {
            document.querySelectorAll('.realtime-annotation-status').forEach(function (el) {
                el.textContent = '已标注'; el.classList.remove('bg-warningYellow'); el.classList.add('bg-successGreen');
            });
            var realtimeEntry = document.getElementById('realtimeAnnotationEntry');
            if (realtimeEntry) realtimeEntry.innerHTML = '<i class="fa fa-check-circle"></i> 人工标注已完成（3 张）';
        }
        function captureSnapshot(button) {
            const original = button.innerHTML;
            button.disabled = true;
            button.innerHTML = '<i class="fa fa-check"></i> 截图成功';
            button.classList.add('border-successGreen', 'text-successGreen');
            setTimeout(function() {
                button.innerHTML = original;
                button.disabled = false;
                button.classList.remove('border-successGreen', 'text-successGreen');
            }, 1600);
        }

        // 标记事件始终定位到事件核查表单。
        function switchTab() {
            document.getElementById("form-tab1").classList.remove("hidden");
        }

        function removePerson(icon) {
            icon.closest('.person-chip').remove();
        }

        function addPerson() {
            const list = document.getElementById('person-list');
            if (list.querySelector('[data-added-person]')) return;
            const chip = document.createElement('span');
            chip.className = 'person-chip';
            chip.dataset.addedPerson = 'true';
            chip.innerHTML = '王安全员(WX001386) <i class="fa fa-times cursor-pointer text-xs" onclick="removePerson(this)"></i>';
            list.insertBefore(chip, document.getElementById('add-person-button'));
        }

        function deleteMark(button) {
            button.closest('.mark-list-item').remove();
        }

        // ===== 数据源 =====
        var violationData = {
            1: { type: 'wz', photos: ['1011', '1012'], content: '未佩戴安全帽', time: '2026-08-05 14:32:16', unit: '采矿一厂', level: 'B类事件', person: '陶炳之(WX000864)、魏伟(WX001258)', location: '中碎作业区', rule: '根据现场画面核实事件情况并记录核查依据。', reviewStatus: '已复核', reviewResult: '确认事件' },
            2: { type: 'wz', photos: ['1041'], content: '未穿反光衣', time: '2026-08-05 14:28:42', unit: '运输车间', level: 'C类事件', person: '陶炳之(WX000864)', location: '井下运输大巷', rule: '根据现场画面核实事件情况并记录核查依据。', reviewStatus: '待复核', reviewResult: '' },
            3: { type: 'yh', photos: ['1042'], content: '跑冒滴漏', time: '2026-08-05 14:24:07', unit: '采矿二厂', level: '一般事件', person: '王安全员', location: '东帮658工作面', rule: '根据现场画面核实事件情况并记录核查依据。', reviewStatus: '待核实', reviewResult: '' }
        };

        // ===== 详情侧边栏 =====
        const eventNames=["未佩戴安全帽", "未穿反光衣", "人员吸烟", "非法闯入", "围栏翻越", "杂物堆积", "烟雾报警", "火焰报警", "跑冒滴漏", "气体泄漏"];
        function eventFields(d){return [['事件名称',d.content],['核查说明/依据',d.rule||'—'],['涉及人员',d.person||'—'],['发现时间',d.time],['监控位置',d.location],['复核状态',d.reviewStatus],['复核结果',d.reviewResult||'—']]}
        const eventEscape=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        function openDetail(type,id){const d=violationData[id];if(!d)return;document.getElementById('detail-title').textContent='事件详情';document.getElementById('detail-body').innerHTML='<img src="sample-no-helmet.jpg" alt="事件现场照片" style="width:100%;height:180px;object-fit:cover;border-radius:8px;margin-bottom:16px">'+eventFields(d).map(([k,v])=>'<div style="margin-bottom:16px"><div style="font-size:12px;color:#8190a5;margin-bottom:6px">'+k+'</div><div style="font-size:14px;color:#24344d">'+eventEscape(v)+'</div></div>').join('');document.getElementById('detail-overlay').style.display='block';document.getElementById('detail-sidebar').style.transform='translateX(0)'}
        function closeDetail() {
            document.getElementById('detail-overlay').style.display = 'none';
            document.getElementById('detail-sidebar').style.transform = 'translateX(100%)';
        }

        // ===== 编辑侧边栏 =====
        function openEdit(type,id){const d=violationData[id];if(!d)return;document.getElementById('edit-title').textContent='编辑事件';document.getElementById('edit-body').innerHTML='<label>事件名称</label><select id="edit-event-name" style="width:100%;height:36px;border:1px solid #d8e2ef;border-radius:8px;margin:8px 0 16px">'+eventNames.map(n=>'<option '+(n===d.content?'selected':'')+'>'+n+'</option>').join('')+'</select><label>核查说明/依据</label><textarea id="edit-event-reason" style="width:100%;height:100px;border:1px solid #d8e2ef;border-radius:8px;margin:8px 0 16px">'+eventEscape(d.rule)+'</textarea><button onclick="saveEventEdit('+id+')" style="height:36px;padding:0 16px;background:#0879ff;color:white;border-radius:8px">保存</button>';document.getElementById('edit-overlay').style.display='block';document.getElementById('edit-sidebar').style.transform='translateX(0)'}
        function saveEventEdit(id){violationData[id].content=document.getElementById('edit-event-name').value;violationData[id].rule=document.getElementById('edit-event-reason').value;document.querySelectorAll('#form-tab2 .mark-list-item').forEach((row,i)=>{const d=violationData[i+1];if(d){const name=row.querySelector('.event-record-name');if(name)name.textContent=d.content}});closeEdit()}
        function closeEdit() {
            document.getElementById('edit-overlay').style.display = 'none';
            document.getElementById('edit-sidebar').style.transform = 'translateX(100%)';
        }

        // ===== XXXX楼栋-楼层（或者室外位置信息） =====
        var gisContext = { inputId: null, btnId: null, markX: 0, markY: 0, hasMark: false };
        // 记录每个场景的标注状态
        var gisMarks = {};

        function openGisMap(inputId, btnId) {
            gisContext.inputId = inputId;
            gisContext.btnId = btnId;
            gisContext.hasMark = false;

            // 恢复已有标注
            var existing = gisMarks[inputId];
            var markPoint = document.getElementById('gis-mark-point');
            var coord = document.getElementById('gis-coord');
            if (existing && existing.hasMark) {
                markPoint.style.display = 'block';
                markPoint.style.left = existing.x + '%';
                markPoint.style.top = existing.y + '%';
                gisContext.markX = existing.x;
                gisContext.markY = existing.y;
                gisContext.hasMark = true;
                coord.textContent = '坐标：' + existing.x.toFixed(1) + '%, ' + existing.y.toFixed(1) + '% (已标注)';
            } else {
                markPoint.style.display = 'none';
                coord.textContent = '坐标：未标注';
            }

            document.getElementById('gis-overlay').style.display = 'flex';
            var modal = document.getElementById('gis-modal');
            modal.style.opacity = '1';
            modal.style.transform = 'translate(-50%,-50%) scale(1)';
            modal.style.pointerEvents = 'auto';
        }

        function placeGisMark(e) {
            var container = document.getElementById('gis-map-container');
            var rect = container.getBoundingClientRect();
            var x = ((e.clientX - rect.left) / rect.width) * 100;
            var y = ((e.clientY - rect.top) / rect.height) * 100;

            var markPoint = document.getElementById('gis-mark-point');
            markPoint.style.display = 'block';
            markPoint.style.left = x + '%';
            markPoint.style.top = y + '%';

            gisContext.markX = x;
            gisContext.markY = y;
            gisContext.hasMark = true;

            document.getElementById('gis-coord').textContent = '坐标：' + x.toFixed(1) + '%, ' + y.toFixed(1) + '%';
        }

        function saveGisMark() {
            if (!gisContext.hasMark) {
                alert('请在地图上点击选择标注点位');
                return;
            }
            // 保存标注状态
            gisMarks[gisContext.inputId] = { hasMark: true, x: gisContext.markX, y: gisContext.markY };
            // 更新按钮文字
            var btn = document.getElementById(gisContext.btnId);
            if (btn) {
                btn.textContent = '查看位置';
                btn.style.color = '#10b981';
            }
            closeGisMap();
        }

        function closeGisMap() {
            document.getElementById('gis-overlay').style.display = 'none';
            var modal = document.getElementById('gis-modal');
            modal.style.opacity = '0';
            modal.style.transform = 'translate(-50%,-50%) scale(0.9)';
            modal.style.pointerEvents = 'none';
        }

    </script>
    </div>
