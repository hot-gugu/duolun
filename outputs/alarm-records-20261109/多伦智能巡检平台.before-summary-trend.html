<div class="workspace"><aside class="sidebar"><div class="side-label">设备与运行管理</div><div class="side-group"><icon name="archive"/>智能巡检设备管理</div><button class="nav active" @click="switchMenu('ledger')">监测设备管理</button><div class="side-bottom"><div><i class="dot"></i>丙烯罐区</div><div>智能感知 · 协同巡检</div><button @click="restoreData" style="border:0;background:none;color:#8190a5;padding:10px 0 0;font-size:12px">重置数据</button></div></aside>
<main class="main"><div class="breadcrumb"><span>智能巡检</span><span>/</span><span>设备管理</span><span>/</span><span style="color:#24344d">监测设备管理</span></div><section class="panel" v-if="!controlDevice"><div class="page-head"><div><h1>监测设备管理</h1><p>统一查看设备档案、运行状态及关联巡查对象</p></div><div class="actions"><button v-if="menu!=='ledger'" class="soft" @click="paused=!paused">{{paused?'继续更新':'暂停更新'}}</button><button v-if="menu==='monitor'" class="soft" @click="refresh">↻ 读取数据</button><button v-if="menu!=='ledger'" class="primary" @click="exportData">↓ {{selected.size?'导出所选':'批量导出'}}</button></div></div>
<div class="stats"><button class="stat" :class="{active:metric==='all'}" @click="metric='all';page=1"><span class="stat-icon"><icon name="archive"/></span><span><span class="stat-title">主设备总数</span><span class="stat-num">{{roots.length}}<small>台</small></span></span></button><button class="stat" style="--accent:#12a36a" :class="{active:metric==='online'}" @click="metric='online';page=1"><span class="stat-icon"><icon name="check"/></span><span><span class="stat-title">在线主设备</span><span class="stat-num">{{onlineCount}}<small>台</small></span></span></button><button class="stat" style="--accent:#ef2f4f" :class="{active:metric==='fault'}" @click="metric='fault';page=1"><span class="stat-icon"><icon name="alert"/></span><span><span class="stat-title">异常主设备</span><span class="stat-num">{{faultCount}}<small>台</small></span></span></button><button class="stat" style="--accent:#d98600" :class="{active:metric==='offline'}" @click="metric='offline';page=1"><span class="stat-icon"><icon name="pulse"/></span><span><span class="stat-title">离线设备</span><span class="stat-num">{{roots.length-onlineCount}}<small>台</small></span></span></button></div>
<div class="filter"><div class="field"><label>设备类型</label><n-select style="width:160px" v-model:value="type" :options="typeOptions" placeholder="全部类型" clearable to="body" :consistent-menu-width="true" @update:value="page=1"/></div><div class="field"><label>所属罐区</label><n-select style="width:138px" v-model:value="region" :options="regionOptions" placeholder="全部区域" clearable to="body" @update:value="page=1"/></div><div class="field"><label>设备状态</label><n-select style="width:120px" v-model:value="status" :options="statusOptions" placeholder="全部状态" clearable to="body" @update:value="page=1"/></div><n-input class="search" v-model:value="keyword" placeholder="搜索设备、巡检点或巡查对象名称及编号" clearable @update:value="page=1"/><button class="soft" @click="reset">重置</button></div>
<div class="table-card"><div class="list-head"><div><span class="list-title">{{archive?'归档设备':'设备列表'}}</span><span class="list-count">共 {{filtered.length}} 台主设备<span v-if="selected.size"> · 已选 {{selected.size}} 项</span></span></div><div class="legend" v-if="menu==='monitor'"><span><i class="dot"></i>{{paused?'已暂停更新':'每5秒更新'}}</span><span>{{sampleTime}}</span></div><button v-else class="primary" @click="exportData">↓ {{selected.size?'导出所选':'批量导出'}}</button></div><div class="table-scroll"><table v-if="rows.length" class="unified-device-table"><thead><tr><th><n-checkbox :checked="rows.length>0&&rows.every(d=>selected.has(d.id))" :indeterminate="rows.some(d=>selected.has(d.id))&&!rows.every(d=>selected.has(d.id))" @update:checked="v=>rows.forEach(d=>check(d.id,v))"/></th><th>设备编号</th><th>设备名称</th><th>设备类型</th><th>所属主设备</th><th>所属罐区</th><th>所属部位</th><th>所属区域</th><th>关联巡检点</th><th>关联巡查对象数量</th><th>在线状态</th><th>运行状态</th><th>当前异常数量</th><th>最近上报时间</th><th>操作</th></tr></thead><tbody><tr v-for="d in rows" :key="d.id" :class="{child:d.parentId,'device-parent-row':d.children?.length}"><td><div class="device-tree-select"><button v-if="d.children?.length" class="group-toggle" :aria-label="(rows.some(c=>c.parentId===d.id)?'收起':'展开')+d.name" :aria-expanded="rows.some(c=>c.parentId===d.id)" @click="toggle(d.id)">{{rows.some(c=>c.parentId===d.id)?'⌄':'›'}}</button><span v-else class="device-tree-spacer"></span><n-checkbox :checked="selected.has(d.id)" @update:checked="v=>check(d.id,v)"/></div></td><td>{{d.id}}</td><td><div class="device-cell"><span class="device-icon"><icon :name="icon(d)"/></span><button class="device-link" @click="open(d)">{{d.name}}</button></div></td><td>{{d.type}}</td><td>{{get(d.parentId)?.name||'—'}}<span v-if="d.parentId" class="subtext">{{d.parentId}}</span></td><td>{{deviceScope(d,'tankArea')}}</td><td>{{deviceScope(d,'tankName')}}<span class="subtext">{{deviceScope(d,'tankId')}}</span></td><td>{{deviceScope(d,'area')}}</td><td><button v-if="devicePatrols(d).length" class="device-link" @click="showLinks(d)">{{devicePatrols(d).length===1?devicePatrols(d)[0].name:devicePatrols(d).length+' 个巡检点'}}<span v-if="devicePatrols(d).length===1" class="subtext">{{devicePatrols(d)[0].id}}</span></button><span v-else>—</span></td><td><button class="device-link" @click="showLinks(d)">{{deviceLinks(d).length}} 个</button></td><td><span class="pill" :class="d.online?'green':'gray'">{{d.online?'在线':'离线'}}</span></td><td><span class="pill" :class="hasFault(d)?'orange':d.online?'green':'gray'">{{hasFault(d)?'异常':d.online?'正常':'未知'}}</span></td><td><button class="device-link" @click="openData(d,'异常记录')">{{deviceFaults(d)}} 条</button></td><td>{{readings(d)[0]?.time||'—'}}</td><td><div class="row-actions"><button class="row-btn" @click="open(d)">详情</button><button class="row-btn" @click="openData(d)">实时数据</button><button class="row-btn" @click="openData(d,'异常记录')">异常记录</button><button v-if="!archive" class="row-btn" @click="startEdit(d)">编辑</button></div></td></tr></tbody></table><div v-else class="empty"><img src="assets/empty.svg" alt=""><p>暂无符合条件的设备</p><small>请调整筛选条件后重试</small><div style="margin-top:16px"><button class="soft" @click="reset">清空筛选</button></div></div></div><div class="pagination"><span>共 {{filtered.length}} 台主设备</span><n-pagination v-model:page="page" v-model:page-size="pageSize" :item-count="filtered.length" :page-sizes="[10,20,50]" show-size-picker @update:page-size="page=1"/></div></div></section><section v-else class="panel control-workspace"><div class="page-head"><div><div class="control-breadcrumb"><button class="device-link" @click="returnMonitor">← 返回设备列表</button></div><h1>{{targetType(controlDevice)}} · {{controlDevice.name}}</h1><p>{{controlDevice.location}}　｜　{{controlDevice.id}}</p></div><div class="actions"><span class="pill" :class="controlDevice.online?'green':'gray'">{{controlDevice.online?'在线':'离线'}}</span><button class="soft" @click="openData(controlDevice)">监测数据</button></div></div><div class="control-layout"><div class="video-column"><div class="video-shell"><div class="video-heading"><span>{{controlMode}}通道</span><span>监控画面 · 未连接视频流</span></div><div class="scene" :class="{playing,thermal:controlMode!=='可见光'}"><img src="assets/tank-scene.svg" alt="丙烯罐区示意画面" :style="{transform:'scale('+zoom+') translate('+(-yaw*.4)+'px,'+(pitch*.4)+'px)'}"><div v-if="playing" class="scene-scan"></div><div v-if="playing&&controlMode==='气云'" class="gas-cloud"></div><div v-if="!playing" class="video-placeholder"><icon name="camera"/><span>{{controlDevice.online?'尚未播放':'设备离线'}}</span><button class="primary" :disabled="!controlDevice.online" @click="playing=true">播放监控画面</button></div><div class="scene-label">{{playing?sampleTime:'示意场景'}}　{{controlMode}}</div></div><div class="video-controls"><div class="actions"><button class="soft" :disabled="!controlDevice.online" @click="playing=!playing">{{playing?'暂停播放':'在线播放'}}</button><button class="soft" @click="capture">抓拍</button></div><n-select v-model:value="controlMode" style="width:150px" :options="controlDevice.type.includes('OGI')?[{label:'可见光通道',value:'可见光'},{label:'气云通道',value:'气云'}]:controlDevice.type==='巡检机器人'?[{label:'可见光通道',value:'可见光'},{label:'热像通道',value:'热像'}]:[{label:'可见光通道',value:'可见光'}]" to="body"/></div></div><div class="surface control-readings"><div class="monitor-toolbar"><h3 class="section-title" style="margin:0">当前监测数据</h3><button class="soft" @click="refresh">读取数据</button></div><div class="reading-grid"><div class="reading-card" v-for="r in readings(controlDevice)"><span class="reading-label">{{r.label}}</span><div class="reading-value" :class="{stale:!r.valid}">{{r.value}}<small>{{r.unit}}</small></div><span class="subtext">{{r.valid?'有效':'已失效'}} · {{r.available===false?'—':r.time.split(' ')[1]}}</span></div></div></div></div><div class="control-right"><div class="surface"><h3 class="section-title">云台控制</h3><div class="ptz-grid"><span></span><button class="soft" aria-label="云台上转" @click="command('云台上转')">↑</button><span></span><button class="soft" aria-label="云台左转" @click="command('云台左转')">←</button><button class="soft" aria-label="停止云台" @click="command('停止云台')">停</button><button class="soft" aria-label="云台右转" @click="command('云台右转')">→</button><span></span><button class="soft" aria-label="云台下转" @click="command('云台下转')">↓</button><span></span></div><div class="ptz-data"><span>水平 {{yaw}}°</span><span>俯仰 {{pitch}}°</span></div><div class="actions" style="justify-content:center"><button class="soft" @click="command('缩小')">－</button><span>{{zoom}}×</span><button class="soft" @click="command('放大')">＋</button></div><span class="subtext" style="text-align:center;margin-top:15px">操控</span></div><div class="surface" v-if="controlDevice.type==='巡检机器人'"><h3 class="section-title">机器人运动控制</h3><div class="ptz-grid"><span></span><button class="soft" @click="command('前进')">前进</button><span></span><button class="soft" @click="command('左转')">左转</button><button class="soft" @click="command('停止运动')">停止</button><button class="soft" @click="command('右转')">右转</button><span></span><button class="soft" @click="command('后退')">后退</button><span></span></div><span class="subtext">{{lastCommand||'暂无操作记录'}}</span></div><div class="surface"><h3 class="section-title">异常与历史</h3><div class="shortcut" @click="openData(controlDevice,'监测曲线')" role="button" tabindex="0" @keydown.enter="openData(controlDevice,'监测曲线')"><icon name="pulse"/><span>监测曲线</span><span>›</span></div><div class="shortcut" @click="openData(controlDevice,'异常记录')" role="button" tabindex="0" @keydown.enter="openData(controlDevice,'异常记录')"><icon name="alert"/><span>异常记录</span><span>{{eventsFor(controlDevice).length}} 条 ›</span></div><span class="subtext" v-if="lastCommand&&controlDevice.type!=='巡检机器人'">{{lastCommand}}</span><span class="subtext" v-if="captureCount">已抓拍 {{captureCount}} 次</span></div></div></div></section></main></div>
<n-drawer :show="drawer" :width="780" placement="right" :mask-closable="false" @update:show="v=>{if(!v)close()}"><n-drawer-content :title="editing?'编辑设备档案':'设备详情'" :native-scrollbar="false"><template #header><div style="display:flex;width:100%;align-items:center;justify-content:space-between"><span>{{editing?'编辑设备档案':'设备详情'}}</span><button class="soft" style="height:30px;border:0;font-size:20px;padding:0 8px" aria-label="关闭抽屉" @click="close">×</button></div></template><div class="drawer-layout unified-device-drawer" v-if="current"><div class="drawer-top"><div class="drawer-device"><span class="device-icon" style="width:46px;height:46px"><icon :name="icon(current)"/></span><div><h2>{{current.name}}</h2><span class="subtext">{{current.id}}　｜　{{current.type}}</span></div><div class="drawer-status"><span class="pill" :class="current.online?'green':'gray'">{{current.online?'在线':'离线'}}</span> <span v-if="hasFault(current)" class="pill orange">{{current.fault?'异常':'挂载设备异常'}}</span></div></div><div class="drawer-meta"><span>{{current.location}}</span><button v-if="current.parentId" class="device-link" style="color:#0879ff;font-size:12px" @click="menu==='monitor'?openData(get(current.parentId)):open(get(current.parentId))">所属主设备：{{get(current.parentId).name}} ↗</button></div></div>
<div class="tab-group"><button v-for="t in (editing?['基础档案','安装与覆盖','接入信息','资产与维保']:tabs.filter(t=>(!isCamera(current)||t!=='监测曲线')&&(t!=='设备控制'||isSound(current))))" class="tab" :class="{active:tab===t}" @click="tab=t">{{isCamera(current)&&t==='实时读数'?'视频预览':t}}</button></div><div class="tab-content">
<template v-if="tab==='关联点位'"><h3 class="section-title">{{isSound(current)?'报警联动巡查对象':'位置与巡查对象关联'}}</h3><div class="surface"><span class="info-label">{{isMobile(current)?'当前所在位置':'安装位置'}}</span><p>{{currentDevicePosition(current)}}</p></div><div class="table-scroll"><table><thead><tr><th>所属罐区</th><th>所属部位</th><th>所属区域</th><th>巡检点名称 / 编号</th><th>巡查对象名称 / 编号</th><th>具体位置</th></tr></thead><tbody><template v-for="m in deviceLinks(current)" :key="m.id"><tr v-for="p in linkedPointsForMonitor(m.id)" :key="p?.id||m.id"><td>{{m.tankArea||'—'}}<span class="subtext">{{m.tankAreaCode||'未同步编号'}}</span></td><td>{{m.tankName||'—'}}<span class="subtext">{{m.tankId||'未同步编号'}}</span></td><td>{{m.area||'—'}}<span class="subtext">{{m.areaCode||'未同步编号'}}</span></td><td>{{p?.name||'未关联'}}<span class="subtext">{{p?.id||'—'}}</span></td><td>{{m.name}}<span class="subtext">{{m.id}}</span></td><td>{{m.location||'—'}}</td></tr></template></tbody></table></div><div v-if="!deviceLinks(current).length" class="empty"><img src="assets/empty.svg" alt=""><p>暂无关联巡查对象</p></div></template><template v-else-if="tab==='实时读数'"><template v-if="isSound(current)"><div class="empty"><img src="assets/empty.svg" alt=""><p>该设备无数值采集项</p></div></template><template v-else-if="isCamera(current)"><section class="device-camera-player"><header><span>{{current.name}}</span><button class="row-btn" @click="cameraModal=true">放大查看</button></header><div class="device-camera-stage"><video v-if="cameraPlaying&&cameraUrl&&!cameraModal&&!cameraError" :src="cameraUrl" :poster="current.previewUrl||'assets/propylene-tanks.jpg'" autoplay controls playsinline @error="cameraError=true"></video><template v-else><img :src="current.previewUrl||'assets/propylene-tanks.jpg'" alt="工业现场预览示意"><div v-if="!cameraPlaying||cameraError" class="device-camera-overlay"><span>{{cameraError?'视频加载失败':current.online?'点击播放视频':'设备离线'}}</span><button v-if="current.online" class="primary" @click="startCamera">{{cameraError?'重试':'播放'}}</button></div><span v-else class="device-camera-demo">演示画面 · 未连接视频流</span></template></div><footer><span>{{current.id}}</span><button v-if="cameraPlaying" class="soft" @click="cameraPlaying=false">停止播放</button></footer></section></template><template v-else>
<div class="monitor-toolbar"><span class="status-note">采集时间：{{valid(current)?sampleTime:'2026-11-04 10:16:42'}}</span><div class="actions"><span class="pill" :class="valid(current)?'green':'gray'">{{valid(current)?'数据有效':'数据已失效'}}</span><button class="soft" @click="refresh">读取数据</button></div></div>
<div class="reading-grid" v-if="readings(current).length"><div class="reading-card" v-for="r in readings(current)" :key="r.key"><span class="reading-label">{{r.label}}</span><div class="reading-value" :class="{stale:!r.valid}">{{r.value}}<small>{{r.unit}}</small></div><span class="subtext">{{r.valid?'最新采集':'最后有效值'}} · {{r.available===false?'—':r.time.split(' ')[1]}}</span></div></div>
<div v-else class="empty"><img src="assets/empty.svg" alt=""><p>暂无数值监测项</p><small>此设备仅提供运行状态</small></div>
<div class="surface"><div class="info-grid"><div class="info-item"><span class="info-label">当前工作状态</span><span class="info-value">{{current.work}}</span></div><div class="info-item"><span class="info-label">当前巡检任务</span><span class="info-value">{{current.type==='巡检机器人'?'丙烯罐区日常巡检':'—'}}</span></div><div class="info-item"><span class="info-label">{{isMobile(current)?'当前所在位置':'安装位置'}}</span><span class="info-value">{{currentDevicePosition(current)}}</span></div><div class="info-item"><span class="info-label">数据来源</span><span class="info-value">{{current.parentId?'机器人挂载采集':current.type.includes('OGI')?'气云设备采集':'设备采集'}}</span></div></div></div>
<div v-if="targetType(current)" class="workspace-entry"><div><h3>{{targetType(current)}}</h3><span> {{current.name}} </span></div><button class="primary" @click="enterWorkspace(current)">进入{{targetType(current)}} ↗</button></div>
<template v-if="current.children&&current.children.length"><h3 class="section-title">挂载设备实时数据</h3><div class="attachment-reading" v-for="c in current.children"><div><button class="device-link" @click="openData(c)">{{c.name}} ↗</button><span class="subtext">{{summary(c)}}</span></div><span class="pill" :class="valid(c)?'green':'gray'">{{valid(c)?'有效':'已失效'}}</span></div></template>
</template></template>
<template v-else-if="tab==='设备控制'&&isSound(current)"><h3 class="section-title">声光报警控制</h3><div class="actions" style="margin:16px 0 24px"><button class="primary" :disabled="!current.online||soundResponse(current)==='模拟开启'" @click="soundControl(true)">开启声光报警</button><button class="soft" :disabled="!current.online||soundResponse(current)==='模拟关闭'" @click="soundControl(false)">关闭声光报警</button></div><h3 class="section-title">当前联动报警</h3><div v-for="a in soundAlarms(current)" :key="a.id" class="record"><p>{{a.name}} · {{a.level}}</p><small>{{a.monitor}} · {{a.id}} · {{a.time}}</small></div><div v-if="!soundAlarms(current).length" class="empty"><img src="assets/empty.svg" alt=""><p>当前无联动报警</p></div></template><template v-else-if="tab==='监测曲线'"><template v-if="isSound(current)"><div class="empty"><img src="assets/empty.svg" alt=""><p>该设备无监测曲线</p></div></template><template v-else><div class="monitor-toolbar"><n-select v-model:value="curveKey" :options="curveOptions" :placeholder="curveOptions[0]?.label||'暂无监测项'" style="width:240px" to="body"/><n-select v-model:value="range" :options="[{label:'近1小时',value:'1h'},{label:'近6小时',value:'6h'},{label:'近24小时',value:'24h'}]" style="width:130px" to="body"/></div>
<template v-if="curve"><div class="chart-card"><div class="chart-title"><span>{{curve.label}}</span><span class="status-note">{{curve.unit}}</span></div><svg class="trend-chart" viewBox="0 0 670 265" role="img" :aria-label="curve.label+'监测曲线'"><g v-for="t in curve.ticks"><line x1="54" x2="624" :y1="t.y" :y2="t.y" stroke="#e7eef8"/><text x="42" :y="t.y+4" text-anchor="end">{{t.label}}</text></g><g v-for="l in curve.labels"><text :x="l.x" y="240" text-anchor="middle">{{l.label}}</text></g><path :d="curve.path" fill="none" stroke="#0879ff" stroke-width="2"/><circle v-for="(pt,i) in curve.points" :key="i" :cx="pt.x" :cy="pt.y" r="3" fill="#0879ff"><title>{{new Date(pt.time).toLocaleTimeString('zh-CN')}} · {{pt.value}} {{curve.unit}}</title></circle></svg><div v-if="!valid(current)" class="stale chart-note">断传后不补绘数据，曲线仅保留最后有效采样。</div></div><div class="status-cards"><div class="status-box"><small>最高值</small><strong>{{curve.max}} <small class="inline-unit">{{curve.unit}}</small></strong></div><div class="status-box"><small>最低值</small><strong>{{curve.min}} <small class="inline-unit">{{curve.unit}}</small></strong></div><div class="status-box"><small>平均值</small><strong>{{curve.avg}} <small class="inline-unit">{{curve.unit}}</small></strong></div></div></template><div v-else class="empty"><img src="assets/empty.svg" alt=""><p>暂无监测曲线</p><small>该设备暂无可展示的数值采样</small></div></template></template>

ss-compact-card\"><h3 class=\"section-title\">报警照片</h3><button v-if=\"currentAlarm.snapshotUrl\" class=\"robot-photo-button\" @click=\"robotPhoto={src:currentAlarm.snapshotUrl,alt:'报警照片',time:currentAlarm.time}\"><img :src=\"currentAlarm.snapshotUrl\" alt=\"报警照片\"/></button><prod-empty-state v-else text=\"暂无报警照片\" compact/></section><section class=\"surface process-compact-card\"><h3 class=\"section-title\">报警短视频</h3><video v-if=\"currentAlarm.clipUrl\" :src=\"currentAlarm.clipUrl\" controls preload=\"metadata\" class=\"ai-event-video\"></video><prod-empty-state v-else text=\"暂无报警录像片段\" compact/></section></div></template></template>\n<template v-if=\"alarmDetailTab==='机器人核查'\">\n<prod-empty-state v-if=\"!verificationRobotRecords.length\" text=\"暂无机器人核查记录\" compact/>\n<article v-for=\"r in verificationRobotRecords\" :key=\"r.id\" class=\"robot-review-result\">\n<section class=\"surface process-compact-card\"><div class=\"monitor-toolbar\"><h3 class=\"section-title\">机器人核查概况</h3><span class=\"pill\" :class=\"r.state==='已完成'?'green':'blue'\">{{r.state||'—'}}</span></div>\n<div class=\"process-evidence-grid\"><div v-for=\"f in [['任务编号',r.taskId||r.id],['执行机器人',r.robot||'—'],['机器人编号',r.robotId||'—'],['下发时间',r.sentAt||'—'],['开始时间',r.startedAt||'—'],['到点时间',r.arrivedAt||'—'],['结束时间',r.finishedAt||'—'],['巡查对象',currentAlarm.monitorName||mget(currentAlarm.monitor)?.name||'—']]\" :key=\"f[0]\" class=\"info-item\"><span class=\"info-label\">{{f[0]}}</span><span class=\"info-value\">{{f[1]}}</span></div></div>\n<p v-if=\"r.summary\">{{r.summary}}</p><span v-if=\"r.prototype\" class=\"pill gray\">演示数据</span><span v-if=\"r.late\" class=\"pill orange\">判定后返回</span></section>\n<section class=\"surface process-compact-card\"><h3 class=\"section-title\">核查过程</h3><div class=\"verification-timeline\"><article v-for=\"(log,i) in r.logs\" :key=\"i\" class=\"verification-entry\"><p>{{typeof log==='string'?log:[log.time,log.text||log.message].filter(Boolean).join(' ')}}</p></article><template v-if=\"!r.logs?.length\"><article v-for=\"f in [['任务下发',r.sentAt],['开始执行',r.startedAt],['到达点位',r.arrivedAt],['任务结束',r.finishedAt]]\" :key=\"f[0]\" class=\"verification-entry\" v-show=\"f[1]\"><span>{{f[1]}}</span><p>{{f[0]}}</p></article></template></div><prod-empty-state v-if=\"!r.logs?.length&&!r.sentAt&&!r.startedAt&&!r.arrivedAt&&!r.finishedAt\" text=\"暂无核查过程数据\" compact/></section>\n<section class=\"surface process-compact-card\"><h3 class=\"section-title\">现场核查结果</h3><div class=\"process-evidence-grid\"><div class=\"info-item\"><span class=\"info-label\">原报警值</span><span class=\"info-value\">{{alarmFields(currentAlarm).reading}}</span></div><div class=\"info-item\"><span class=\"info-label\">原报警阈值</span><span class=\"info-value\">{{alarmFields(currentAlarm).threshold}}</span></div></div><div v-for=\"(item,i) in r.items\" :key=\"i\" class=\"process-evidence-grid\" style=\"margin-top:16px\"><div v-for=\"f in [['检测项',item.name||'—'],['检测结果',item.value??'—'],['参考阈值',item.threshold||'—'],['采集状态',item.state||'—'],['采集时间',item.time||'—']]\" :key=\"f[0]\" class=\"info-item\"><span class=\"info-label\">{{f[0]}}</span><span class=\"info-value\">{{f[1]}}</span></div></div><prod-empty-state v-if=\"!r.items.length\" text=\"暂无核查结果\" compact/></section>\n<section class=\"surface process-compact-card\"><h3 class=\"section-title\">现场证据</h3><h4 style=\"font-size:14px;font-weight:400\">现场照片</h4><div v-if=\"r.photos.length\" class=\"robot-evidence-grid\"><article v-for=\"photo in r.photos\" :key=\"photo.src\" class=\"robot-evidence-item\"><button class=\"robot-photo-button\" :aria-label=\"photo.alt||'放大现场照片'\" @click=\"robotPhoto=photo\"><img :src=\"photo.src\" :alt=\"photo.alt||'现场照片'\"/></button><time class=\"robot-photo-date\">{{photo.alt}} · {{photo.time||'—'}}</time></article></div><prod-empty-state v-else text=\"暂无现场照片\" compact/><h4 style=\"font-size:14px;font-weight:400;margin-top:20px\">现场视频</h4><div v-if=\"r.videos.length\" class=\"actions\"><button v-for=\"(clip,i) in r.videos\" :key=\"clip.src\" class=\"row-btn\" @click=\"reviewVideo=clip\">{{clip.alt||'现场视频 '+(i+1)}}</button></div><prod-empty-state v-else text=\"暂无现场视频\" compact/></section>\n</article></template>\n<template v-if=\"alarmDetailTab==='人工核查记录'\"><section class=\"surface process-compact-card\"><h3 class=\"section-title\">判定结论</h3><div class=\"process-evidence-grid\"><div v-for=\"f in verificationFields(currentAlarm)\" :key=\"f[0]\" class=\"info-item\"><span class=\"info-label\">{{f[0]}}</span><span class=\"info-value\">{{f[1]}}</span></div></div></section><section class=\"surface process-compact-card\"><h3 class=\"section-title\">人工核查佐证</h3><div v-for=\"r in humanEvidenceFor(currentAlarm)\" :key=\"r.id\" class=\"record\"><p>{{r.text}}</p><small>核查人：{{r.actor}} · 核查时间：{{r.time}}</small><div v-if=\"r.files?.length\" class=\"human-evidence-files\"><article v-for=\"(f,i) in r.files\" :key=\"i\" class=\"human-evidence-file\"><template v-if=\"evidenceFile(f).url\"><button v-if=\"evidenceFile(f).kind==='image'\" class=\"robot-photo-button\" @click=\"robotPhoto={src:evidenceFile(f).url,alt:evidenceFile(f).name,time:r.time}\"><img :src=\"evidenceFile(f).url\" :alt=\"evidenceFile(f).name\"/></button><button v-else-if=\"evidenceFile(f).kind==='video'\" class=\"row-btn\" @click=\"reviewVideo={src:evidenceFile(f).url,time:r.time}\">播放视频</button><a v-else class=\"device-link\" :href=\"evidenceFile(f).url\" :download=\"evidenceFile(f).name\">下载附件</a></template><span>{{evidenceFile(f).name}}</span></article></div><prod-empty-state v-if=\"!r.files.length\" text=\"暂无核查附件\" compact/></div><prod-empty-state v-if=\"!humanEvidenceFor(currentAlarm).length\" text=\"暂无人工核查记录\" compact/></section></template></div></template>\n\n<!-- Handling detail -->\n<template v-if=\"nav==='events'&&detail&&currentEvent\"><div class=\"alarm-summary surface\"><span class=\"pill\" :class=\"currentEvent.state==='处理完成'?'green':'orange'\">{{currentEvent.state}}</span><span>原报警：{{currentEvent.alarmId}}</span><span>生成时间：{{currentEvent.createdAt||'未记录'}}</span><span>完成时间：{{currentEvent.completedAt||'—'}}</span></div><div class=\"tab-group fixed-tabs\"><button v-for=\"t in ['处理记录','关联核查记录']\" :key=\"t\" class=\"tab\" :class=\"{active:recordTab===t}\" @click=\"recordTab=t\">{{t}}</button></div><div class=\"platform-scroll\"><template v-if=\"recordTab==='处理记录'\"><section class=\"surface\"><h3 class=\"section-title\">处理责任与时限</h3><div class=\"process-evidence-grid\"><div class=\"info-item\" v-for=\"f in (tick,eventResponsibility(currentEvent))\" :key=\"f[0]\"><span class=\"info-label\">{{f[0]}}</span><span class=\"info-value\">{{f[1]}}</span></div></div></section><template v-if=\"eventProcessingRecord(currentEvent)\"><section v-for=\"r in [eventProcessingRecord(currentEvent)]\" :key=\"r.id||r.time\" class=\"surface\"><h3 class=\"section-title\">处理记录</h3><div class=\"process-evidence-grid\"><div v-for=\"f in [['处理结果',r.result||'—'],['处理措施',r.measures||r.text||'—'],['处理负责人',r.owner||currentEvent.owner||'—'],['责任岗位',r.responsibleRole||currentEvent.responsibleRole||'—'],['现场复测结果',r.retestResult||'—'],['完成依据',r.completionBasis||'—'],['提交人',r.actor||'—'],['提交时间',r.time||'—']]\" :key=\"f[0]\" class=\"info-item\"><span class=\"info-label\">{{f[0]}}</span><span class=\"info-value\">{{f[1]}}</span></div></div><div v-if=\"r.files?.length\" class=\"human-evidence-files\"><article v-for=\"(f,i) in r.files\" :key=\"i\" class=\"human-evidence-file\"><template v-if=\"evidenceFile(f).url\"><button v-if=\"evidenceFile(f).kind==='image'\" class=\"robot-photo-button\" @click=\"robotPhoto={src:evidenceFile(f).url,alt:evidenceFile(f).name,time:r.time}\"><img :src=\"evidenceFile(f).url\" :alt=\"evidenceFile(f).name\"/></button><button v-else-if=\"evidenceFile(f).kind==='video'\" class=\"row-btn\" @click=\"reviewVideo={src:evidenceFile(f).url,time:r.time}\">播放视频</button><a v-else class=\"device-link\" :href=\"evidenceFile(f).url\" :download=\"evidenceFile(f).name\">下载附件</a></template><span>{{evidenceFile(f).name}}</span></article></div></section></template><prod-empty-state v-else text=\"暂无处理记录\" compact/></template><template v-if=\"recordTab==='关联核查记录'\"><section v-if=\"eventAlarm(currentEvent)\" class=\"surface\"><h3 class=\"section-title\">关联报警及核查结论</h3><div class=\"process-evidence-grid\"><div class=\"info-item\" v-for=\"f in [['关联报警编号',currentEvent.alarmId],['报警名称',eventAlarm(currentEvent).name],['报警等级',eventAlarm(currentEvent).level],...alarmOwnership(eventAlarm(currentEvent)),...eventVerification(currentEvent)]\" :key=\"f[0]\"><span class=\"info-label\">{{f[0]}}</span><span class=\"info-value\">{{f[1]}}</span></div></div><button class=\"row-btn\" @click=\"openEventVerification\">查看完整核查记录</button></section><prod-empty-state v-else text=\"暂无关联核查记录\" compact/></template></div></template>\n\n<!-- Levels -->\n<alarm-response-config v-if=\"nav==='levels'\" :store=\"store\" :persist=\"persist\" @navigate=\"navigatePointRecord\"/>\n\n<!-- Point data workbench -->\n<point-management v-if=\"nav==='points'||nav==='monitors'\" :mode=\"nav\" :store=\"store\" :monitors=\"monitors\" :persist=\"persist\" @navigate=\"navigatePointRecord\"/>\n</section></main></div>\n\n<n-modal :show=\"!!robotPhoto\" @update:show=\"v=>{if(!v)robotPhoto=null}\" preset=\"card\" title=\"现场证据\" :style=\"{width:'960px',maxWidth:'94vw'}\" closable><div v-if=\"robotPhoto\" class=\"robot-photo-preview\"><img :src=\"robotPhoto.src\" :alt=\"robotPhoto.alt\"/><time class=\"robot-photo-date\">{{robotPhoto.time}}</time></div></n-modal><!-- Modal actions -->\n<n-modal :show=\"!!modal\" :mask-closable=\"false\" @update:show=\"v=>{if(!v)modal=''}\" preset=\"card\" :title=\"modal==='decision'?modalTitle:modal==='handle'?'确认处理完成':modal==='review'?'下发机器人临时复查':modal==='task'?(editingTask?'修改任务':'创建巡检任务'):modal==='level'?'修改等级映射':modal==='recovery'?'统一自动恢复时长':modal==='cancel'?'删除任务':modal==='monitor'?'关联巡查对象':'证据'\" :style=\"{width:modal==='monitor'?'1120px':modal==='task'?'920px':'680px',maxWidth:'94vw'}\" class=\"platform-modal\"><div class=\"modal-scroll\">\n<template v-if=\"modal==='decision'||modal==='handle'\"><p class=\"status-note\">本次选择 {{batchIds.length}} 条{{modal==='decision'?'报警':'处理事件'}}，分别保存记录</p><n-form label-placement=\"top\"><template v-if=\"modal==='handle'\"><n-form-item label=\"处理状态\"><n-input :value=\"handlingState\" disabled/></n-form-item><div class=\"pm-form-grid\"><n-form-item label=\"处理负责人\"><n-input v-model:value=\"handlingOwner\" placeholder=\"填写现场处理负责人\"/></n-form-item><n-form-item label=\"责任岗位\"><n-select v-model:value=\"handlingRole\" :options=\"opts(['当班值守人员','当班负责人','班组负责人','上级负责人'])\" clearable to=\"body\"/></n-form-item></div></template><n-form-item v-if=\"modal==='handle'\" label=\"现场确认及完成依据\" required><n-input v-model:value=\"completionBasis\" type=\"textarea\" placeholder=\"说明采取的措施、现场确认情况及完成依据\"/></n-form-item><n-form-item v-if=\"modal==='handle'\" label=\"处理结果\" required><n-input v-model:value=\"handlingResult\" placeholder=\"填写本次处理结果\"/></n-form-item><n-form-item :label=\"modal==='decision'?'核查说明':'处理措施'\" required><n-input v-model:value=\"reason\" type=\"textarea\" :rows=\"4\" placeholder=\"说明核查依据或本次采取的处理措施\"/></n-form-item><n-form-item v-if=\"modal==='handle'\" label=\"现场复测结果（选填）\"><n-input v-model:value=\"retestResult\" placeholder=\"填写现场复测读数及单位，或现场确认结果\"/></n-form-item><n-form-item label=\"附件（选填）\"><n-upload :default-upload=\"false\" multiple @update:file-list=\"updateEvidenceFiles\"><button class=\"soft\">选择图片或其他附件</button></n-upload></n-form-item></n-form><div class=\"actions modal-actions\"><button class=\"soft\" @click=\"modal=''\">取消</button><button class=\"primary\" :disabled=\"attachmentsLoading\" @click=\"modal==='decision'?submitDecision():submitHandle()\">{{attachmentsLoading?'附件读取中':'确认提交'}}</button></div></template>\n<template v-if=\"modal==='review'\"><div class=\"surface\"><h3 class=\"section-title\">本次复查范围</h3><p>所选报警 {{batchIds.length}} 条 · 可复查 {{reviewPoints.length}} 个巡查对象</p><p v-for=\"p in reviewPoints\">{{mget(p)?.name}} · {{p}}</p></div><div class=\"fault\" v-if=\"invalidPoints.length\"><h3>以下点位不可下发</h3><p v-for=\"p in invalidPoints\">{{pname(p)}}：巡查对象不存在或已停用</p><p>确认后仅下发可复查点，其余报警保留原核查状态。</p></div><n-form-item label=\"机器人忙碌时的调度方式\"><n-select v-model:value=\"reviewPriority\" :options=\"opts(['排队执行'])\" to=\"body\"/></n-form-item><div class=\"actions modal-actions\"><button class=\"soft\" @click=\"modal=''\">取消</button><button class=\"primary\" :disabled=\"!reviewPoints.length\" @click=\"sendRobot\">确认并下发任务</button></div></template>\n<template v-if=\"modal==='recovery'\"><n-form-item label=\"手动接管后无操作恢复时长（3台设备共用）\"><n-input-number v-model:value=\"recoverMinutes\" :min=\"1\" :max=\"120\"><template #suffix>分钟</template></n-input-number></n-form-item><div class=\"modal-actions actions\"><button class=\"soft\" @click=\"modal=''\">取消</button><button class=\"primary\" @click=\"saveRecovery\">保存</button></div></template>\n<template v-if=\"modal==='level'&&editLevel\"><p>{{editLevel.source}} · {{editLevel.name}} {{editLevel.band}}</p><n-form-item label=\"平台报警等级\"><n-select v-model:value=\"editLevel.level\" :options=\"opts(['一级','二级','三级'])\" to=\"body\"/></n-form-item><p class=\"status-note\">保存只影响新报警，已有报警保留产生时等级。</p><div class=\"actions modal-actions\"><button class=\"soft\" @click=\"modal=''\">取消</button><button class=\"primary\" @click=\"saveLevel\">保存映射</button></div></template>\n<template v-if=\"modal==='cancel'\"><p class=\"status-note\">删除未开始任务后将从任务列表移除，已执行记录及关联报警保留。</p><n-form-item label=\"删除范围\"><n-select v-model:value=\"editingScope\" :options=\"opts(['仅本次','本次及后续'])\" to=\"body\"/></n-form-item><div class=\"actions modal-actions\"><button class=\"soft\" @click=\"modal=''\">返回</button><button class=\"primary\" @click=\"confirmCancel\">确认删除</button></div></template>\n<template v-if=\"modal==='task'\"><div class=\"tab-group fixed-tabs\"><button v-for=\"t in ['基础信息','点位与执行','周期与高级']\" class=\"tab\" :class=\"{active:editorStep===t}\" @click=\"editorStep=t\">{{t}}</button></div><n-form label-placement=\"top\"><div class=\"form-grid\" v-if=\"editorStep==='基础信息'\"><n-form-item label=\"任务名称\" required class=\"full\"><n-input v-model:value=\"taskForm.name\" placeholder=\"请输入任务名称\"/></n-form-item><n-form-item label=\"任务模板\" required><n-select v-model:value=\"taskForm.template\" :options=\"[{label:'罐区例行巡检模板',value:'TPL-01'},{label:'泵区红外快巡模板',value:'TPL-02'}]\" to=\"body\" @update:value=\"templateChange\"/></n-form-item><n-form-item label=\"巡检类型\" required><n-select v-model:value=\"taskForm.type\" :options=\"opts(formOptions.types)\" to=\"body\"/></n-form-item><n-form-item label=\"巡检模式\" required><n-select v-model:value=\"taskForm.mode\" :options=\"opts(formOptions.modes)\" to=\"body\"/></n-form-item><n-form-item label=\"结束动作\" required><n-select v-model:value=\"taskForm.endAction\" :options=\"opts(formOptions.ends)\" to=\"body\"/></n-form-item><n-form-item v-if=\"taskForm.endAction==='前往停靠点'\" label=\"目标停靠点\" required><n-select v-model:value=\"taskForm.stopPoint\" :options=\"pointOptions\" to=\"body\"/></n-form-item><n-form-item v-if=\"editingTask\" label=\"修改范围\"><n-select v-model:value=\"editingScope\" :options=\"opts(['仅本次','本次及后续'])\" to=\"body\"/></n-form-item></div>\n<div v-if=\"editorStep==='点位与执行'\"><n-form-item label=\"巡检点（使用我方系统检查项）\" required><n-select v-model:value=\"taskForm.points\" multiple :options=\"pointOptions\" to=\"body\"/></n-form-item><div class=\"surface\" v-for=\"id in taskForm.points\"><span>{{pname(id)}}</span><span class=\"subtext\">我方检查项：{{pget(id)?.checks.join('、')}}</span></div><div class=\"form-grid\"><n-form-item label=\"任务类型\" required><n-select v-model:value=\"taskForm.kind\" :options=\"opts(formOptions.kinds)\" to=\"body\"/></n-form-item><n-form-item v-if=\"taskForm.kind==='定期任务'\" label=\"执行日期\" required><n-date-picker v-model:value=\"taskForm.date\" type=\"date\" to=\"body\"/></n-form-item><n-form-item label=\"启动时间\"><n-time-picker v-model:formatted-value=\"taskForm.time\" format=\"HH:mm\" value-format=\"HH:mm\" to=\"body\"/></n-form-item></div></div>\n<div v-if=\"editorStep==='周期与高级'\"><template v-if=\"taskForm.kind==='周期任务'\"><div class=\"form-grid\"><n-form-item label=\"周期类型\"><n-select v-model:value=\"taskForm.cycle\" :options=\"opts(['定周期','不定周期'])\" to=\"body\"/></n-form-item><n-form-item label=\"开始日期\" required><n-date-picker v-model:value=\"taskForm.start\" type=\"date\" to=\"body\"/></n-form-item><n-form-item label=\"结束日期\" required><n-date-picker v-model:value=\"taskForm.end\" type=\"date\" to=\"body\"/></n-form-item><n-form-item label=\"是否持续自动续订\"><n-switch v-model:value=\"taskForm.renew\"/></n-form-item><n-form-item v-if=\"taskForm.cycle==='定周期'\" label=\"每隔\"><div class=\"actions\"><n-input-number v-model:value=\"taskForm.every\" :min=\"1\" style=\"width:130px\"/><n-select v-model:value=\"taskForm.unit\" :options=\"opts(['小时','天'])\" style=\"width:100px\" to=\"body\"/></div></n-form-item></div><template v-if=\"taskForm.cycle==='不定周期'\"><div class=\"actions\" style=\"margin-bottom:12px\" v-for=\"(d,i) in taskForm.dates\"><n-date-picker v-model:value=\"d.date\" type=\"date\" to=\"body\"/><n-time-picker v-model:formatted-value=\"d.time\" value-format=\"HH:mm\" format=\"HH:mm\" to=\"body\"/><button class=\"soft\" @click=\"taskForm.dates.splice(i,1)\">移除</button></div><button class=\"soft\" @click=\"taskForm.dates.push({date:taskForm.start,time:'08:00'})\">＋ 添加执行日期</button></template></template><div v-else class=\"surface\"><span>当前为{{taskForm.kind}}，无需配置周期。</span></div><h3 class=\"section-title\" style=\"margin-top:20px\">高级配置</h3><div class=\"form-grid\"><n-form-item label=\"超时时长\"><n-input-number v-model:value=\"taskForm.timeout\" placeholder=\"接口定义待确认\" :disabled=\"true\"/></n-form-item><n-form-item label=\"超时动作\"><n-select v-model:value=\"taskForm.timeoutAction\" :options=\"[]\" placeholder=\"第三方动作定义待确认\" disabled to=\"body\"/></n-form-item><n-form-item label=\"超期上限\"><n-input-number v-model:value=\"taskForm.overLimit\" placeholder=\"接口定义待确认\" disabled/></n-form-item></div></div></n-form><div class=\"actions modal-actions\"><button class=\"soft\" @click=\"modal=''\">取消</button><button v-if=\"editorStep!=='基础信息'\" class=\"soft\" @click=\"editorStep=editorStep==='周期与高级'?'点位与执行':'基础信息'\">上一步</button><button v-if=\"editorStep!=='周期与高级'\" class=\"primary\" @click=\"editorStep=editorStep==='基础信息'?'点位与执行':'周期与高级'\">下一步</button><button v-else class=\"primary\" @click=\"saveTask\">确认下发任务</button></div></template>\n<template v-if=\"modal==='evidence'\"><div class=\"scene\"><img src=\"assets/tank-scene.svg\" alt=\"证据\"><div class=\"scene-label\">影像预览</div></div><div class=\"actions modal-actions\"><button class=\"soft\" @click=\"modal=''\">关闭</button></div></template>\n<template v-if=\"modal==='monitor'&&detailEvent\"><div class=\"linked-trend-layout\"><section class=\"surface linked-live-card\"><h3 class=\"section-title\">当前实时值</h3><p>{{detailEvent.name}}</p><span class=\"subtext\">{{detailEvent.id}}</span><div class=\"reading-value\">{{detailEvent.value??'—'}}<small>{{detailEvent.unit}}</small></div><span class=\"pill\" :class=\"detailEvent.quality==='有效'?'green':'orange'\">{{detailEvent.quality||'未返回质量状态'}}</span><p class=\"subtext\">采集时间：{{detailEvent.sampleTime||'—'}}</p></section><section class=\"surface linked-trend-card\"><h3 class=\"section-title\">历史趋势</h3><div class=\"linked-trend-filter\"><n-date-picker v-model:value=\"monitorRange.draft\" type=\"datetimerange\" to=\"body\" clearable/><button class=\"primary\" @click=\"queryMonitorRange\">查询</button><button class=\"soft\" @click=\"resetMonitorRange\">重置</button></div><svg viewBox=\"0 0 820 275\" class=\"trend-chart\" aria-label=\"巡查对象历史趋势\"><g v-for=\"tick in monitorTrend.ticks\"><line x1=\"65\" x2=\"775\" :y1=\"tick.y\" :y2=\"tick.y\" stroke=\"#e7eef8\"/><text x=\"55\" :y=\"tick.y+4\" text-anchor=\"end\">{{tick.label}}</text></g><path d=\"M65 40V220H775\" fill=\"none\" stroke=\"#8190a5\"/><text x=\"65\" y=\"22\">{{detailEvent.unit}}</text><path v-if=\"monit
