const closed=[['储罐液位高报','LI414004B','二级','H','液位','86 %','≥ 85 %','DCS'],['储罐压力高报','PI414007A','二级','H','压力','1.72 MPa','≥ 1.6 MPa','DCS'],['罐底可燃气体浓度高报','GT_414023','二级','H','可燃气体浓度','24.8 %LEL','≥ 20 %LEL','GDS'],['阀组疑似气体泄漏','气云装置01 / 预置位1','二级','H','路径积分浓度','680 ppm·m','≥ 600 ppm·m','气云设备']].map((x,i)=>({x,id:i,time:'2026-11-04 '+['09:40:21','06:00:00','06:20:00','06:40:00'][i],status:i===3?'处理完成':'待处理',person:i===3?'值守人员':'—'}));let tab=0,query='',filter='全部';const app=document.querySelector('#app');function launch(){app.innerHTML='<section class="screen landing"><button class="brand" aria-label="打开智能巡检" onclick="login()">'+icon+'</button><h1>智能巡检</h1><p>报警及时核查 · 事件闭环处理</p><button class="primary wide" onclick="login()">进入智能巡检</button><p style="margin-top:80px;font-size:12px">大唐煤化工 · 移动巡检工作台</p></section>'}function login(){app.innerHTML='<section class="screen login"><div class="brand">'+icon+'</div><h1>登录智能巡检</h1><p>登录后开始今日的巡检工作</p><form onsubmit="event.preventDefault();signin()"><label for="account">账号</label><input id="account" autocomplete="username" placeholder="请输入账号" required><label for="password">密码</label><div style="display:flex;gap:6px"><input id="password" type="password" autocomplete="current-password" placeholder="请输入密码" required><button type="button" onclick="const p=document.querySelector(\'#password\');p.type=p.type===\'password\'?\'text\':\'password\';this.textContent=p.type===\'password\'?\'显示\':\'隐藏\'">显示</button></div><p class="error" id="err"></p><button class="primary wide">登录</button></form><p style="font-size:12px;text-align:center">交互演示：输入任意非空账号及密码即可登录</p></section>'}function signin(){if(!document.querySelector('#account').value.trim()){document.querySelector('#err').textContent='请输入有效账号';return}home()}function home(){app.innerHTML='<header><div class="head"><strong>智能巡检</strong><button onclick="login()">退出登录</button></div><div class="tabs"><button class="'+(!tab?'active':'')+'" onclick="switchTab(0)">实时报警核查</button><button class="'+(tab?'active':'')+'" onclick="switchTab(1)">报警闭环处理</button></div></header><div class="toolbar"><input aria-label="搜索报警" placeholder="搜索事件、对象或报警来源" oninput="query=this.value;render()"><select aria-label="筛选状态" onchange="filter=this.value;render()">'+(tab?['全部','待处理','处理完成']:['全部','一级','二级','三级']).map(v=>'<option>'+v+'</option>').join('')+'</select></div><div class="summary" id="summary"></div><section id="list"></section><div class="note">演示数据 · 共 '+(tab?closed.length:realtime.length)+' 条记录</div>';render()}function switchTab(t){tab=t;query='';filter='全部';home()}function fields(d){return '<dl><dt>报警巡查对象</dt><dd>'+d.x[1]+'</dd><dt>报警档位</dt><dd>'+d.x[3]+'</dd><dt>报警来源</dt><dd>'+d.x[7]+'</dd>'+(tab?'<dt>处置人</dt><dd>'+d.person+'</dd><dt>处置单位</dt><dd>'+escapeText(d.completion?.unit||'—')+'</dd>':'<dt>所属罐区/罐体</dt><dd>丙烯罐区 / A罐</dd><dt>巡检点名称</dt><dd>'+d.x[8]+'</dd>')+'</dl>'}function render(){const data=(tab?closed:realtime).filter(d=>(filter==='全部'||(tab?d.status:d.x[2])===filter)&&d.x.join(' ').toLowerCase().includes(query.trim().toLowerCase()));document.querySelector('#summary').textContent=(tab?'处理事件列表':'实时报警列表')+' · '+data.length+' 条';document.querySelector('#list').innerHTML=data.map(d=>'<article class="card"><div class="row"><span class="badge '+(d.x[2]==='一级'?'red':d.x[2]==='三级'?'blue':'')+'">'+d.x[2]+'报警</span><span class="badge '+(d.status==='处理完成'?'green':'')+'">'+d.status+'</span></div><h2>'+d.x[0]+'</h2><div class="time">'+d.time+'</div><div class="reading"><div><small>'+d.x[4]+' · 报警值</small><strong>'+d.x[5]+'</strong></div><div class="limit"><small>触发阈值</small><br>'+d.x[6]+'</div></div>'+fields(d)+'<div class="actions">'+(tab?'<button onclick="details('+d.id+')">详情</button>'+(d.status==='待处理'?'<button class="primary" onclick="completeItem('+d.id+')">确认处理完成</button>':''):'<button class="judge-true" onclick="judgeAlarm('+d.id+',true)">判真警</button><button class="judge-false" onclick="judgeAlarm('+d.id+',false)">判误报</button><button class="primary" onclick="openEvidence('+d.id+')">核查佐证</button>')+'</div></article>').join('')||'<div class="empty">未找到符合条件的报警<br>请调整关键词或筛选条件</div>'}function details(id){const d=closed[id];const dialog=document.querySelector('#dialog');dialog.innerHTML='<h2>'+d.x[0]+'</h2><p>'+d.time+' · '+d.status+'</p>'+fields(d)+'<dl><dt>报警等级</dt><dd>'+d.x[2]+'</dd><dt>监测项</dt><dd>'+d.x[4]+'</dd><dt>报警值</dt><dd>'+d.x[5]+'</dd><dt>触发阈值</dt><dd>'+d.x[6]+'</dd></dl><button class="primary wide" onclick="document.querySelector(\'#dialog\').close()">关闭</button>';dialog.showModal()}function completeItem(id){const dialog=document.querySelector('#dialog');dialog.innerHTML='<h2>确认处理完成？</h2><p>'+closed[id].x[0]+'</p><p>请确认现场处置已完成。确认后，本条事件将标记为处理完成。</p><div class="row"><button onclick="document.querySelector(\'#dialog\').close()">取消</button><button class="primary" onclick="closed['+id+'].status=\'处理完成\';closed['+id+'].person=\'当前登录人员\';document.querySelector(\'#dialog\').close();render();toast(\'已标记为处理完成\')">确认完成</button></div>';dialog.showModal()}function judgeAlarm(id,isTrue){realtime[id].status=isTrue?'已判真警':'已判误报';render();toast(isTrue?'已判定为真警':'已判定为误报')}let evidenceId=0,evidenceTab=0;

function deviceChart(title,unit){return '<div class="row time"><span>'+title+'趋势（演示）</span><span>'+unit+'</span></div><svg viewBox="0 0 330 140" style="width:100%;margin-top:10px" role="img" aria-label="近十分钟演示趋势"><path d="M25 20H315M25 60H315M25 100H315" stroke="#e1e8f1"/><path d="M25 45H315" stroke="#c28a23" stroke-dasharray="4 3"/><path d="M25 100C50 100 60 25 85 25S125 100 150 100S190 25 215 25S255 100 280 80S300 30 315 25" stroke="#2475ec" stroke-width="2.5" fill="none"/><g fill="#718097" font-size="11"><text x="25" y="130">10:10:33</text><text x="260" y="130">10:20:33</text></g></svg><div class="row time"><span>蓝线：测量值</span><span>虚线：阈值</span><span>近10分钟</span></div>'}

</span>':'')+'<div class="reading"><div><small>'+v[2]+'</small><strong style="'+(i===2?'color:#172b46':'')+'">'+v[3]+' <small>'+v[4]+'</small></strong></div><div class="limit"><small>报警档位 / 等级</small><br><b>'+v[5]+'</b></div></div><dl><dt>具体位置</dt><dd>'+v[6]+'</dd></dl><div style="border-top:1px solid #edf0f5;padding-top:14px">'+deviceChart(v[2],v[4])+'</div></article>').join('')}}
function alarmDetailContent(d){const value=evidenceId===0?'2.108 MPa':d.x[5];return '<article class="card"><h2 style="margin-top:0">报警基本信息</h2><div class="basic-grid">'+[['巡查对象名称',d.x[1]],['所属部位','T41402A'],['报警来源',d.x[7]],['报警时间',d.time],['监测项',d.x[4]],['报警值',d.x[5]],['触发阈值',d.x[6]],['报警档位 / 报警等级',d.x[3]+' / '+d.x[2]]].map((v,i)=>'<div><div class="field-label">'+v[0]+'</div><div class="field-value '+([5,7].includes(i)?'alarm-emphasis':'')+'">'+v[1]+'</div></div>').join('')+'</div></article><article class="card"><div class="row"><h2 style="margin:0">当前监测与趋势</h2><span class="badge green">数据有效</span></div><div class="reading"><div><small>'+d.x[4]+' · 当前值</small><strong>'+value+'</strong></div><div class="limit"><small>报警档位 / 等级</small><br><b>'+d.x[3]+' / '+d.x[2]+'</b></div></div><dl><dt>源端报警状态</dt><dd style="color:#c6324e">报警中</dd><dt>触发阈值</dt><dd>'+d.x[6]+'</dd></dl><div style="border-top:1px solid #edf0f5;padding-top:14px">'+deviceChart(d.x[4],d.x[5].replace(/[0-9. ]/g,'')).replace('<path d="M25 45H315"','<path d="M315 20V100" stroke="#bd2946" stroke-dasharray="4 3"/><circle cx="315" cy="25" r="4" fill="#bd2946"/><path d="M25 45H315"')+'<div class="time" style="margin-top:10px;color:#b42340">红色竖线：报警发生</div></div></article><div class="note">监测值与趋势为演示数据</div>'}

function toast(s){document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=s;document.body.append(e);setTimeout(()=>e.remove(),2600)}let judgmentContext=null,judgmentImages=[];

judgeAlarm=function(id,isTrue){openJudgment(id,isTrue,false)};
evidenceDecision=function(isTrue){openJudgment(evidenceId,isTrue,true)};
function openJudgment(id,isTrue,fromDetail){judgmentContext={id,isTrue,fromDetail};judgmentImages=[];const d=realtime[id];app.innerHTML='<header><div class="head" style="padding-bottom:16px"><button onclick="cancelJudgment()">〈 返回</button><strong style="font-size:19px">填报'+(isTrue?'真警':'误报')+'</strong><span></span></div></header><form id="judgmentForm" class="screen" style="padding-top:0;padding-bottom:115px" onsubmit="event.preventDefault();submitJudgment()"><label for="jtime">报警（误报）时间</label><input id="jtime" type="datetime-local" step="1" required value="'+d.time.replace(' ','T')+'"><label for="jplace">报警（误报）地点</label><input id="jplace" value="丙烯罐区'+(d.x[7]==='GDS'?'泵房内南侧':' 41402A 西北角 0 米')+'"><label for="jcontent">报警（误报）内容</label><input id="jcontent" value="'+escapeText(d.x[0])+'"><fieldset style="border:0;padding:0;margin:25px 0 0"><legend>核查方式 <span style="color:#bd2946">*</span></legend><div style="display:flex;gap:24px;margin-top:10px"><label style="display:flex;align-items:center;gap:8px;margin:0;min-height:44px"><input style="width:auto" type="radio" name="method" value="线上核查" checked required>线上核查</label><label style="display:flex;align-items:center;gap:8px;margin:0;min-height:44px"><input style="width:auto" type="radio" name="method" value="线下核查">线下核查</label></div></fieldset><label for="jsituation">报警信息核查情况 <span style="color:#bd2946">*</span></label><textarea id="jsituation" required maxlength="2000" placeholder="请输入现场核查情况及判定依据" style="width:100%;min-height:120px;border:1px solid #d6dfea;border-radius:9px;padding:13px;font:inherit;color:#172b46"></textarea><label for="jrecorder">记录人 <span style="color:#bd2946">*</span></label><select id="jrecorder" required><option value="">请选择记录人</option><option>当前登录人员</option><option>值守人员（演示）</option><option>巡检人员（演示）</option></select><label for="jimages">拍照上传</label><input id="jimages" type="file" accept="image/*" capture="environment" style="display:none" onchange="previewJudgmentImages(this)"><button type="button" style="width:100%;border:1px dashed #9fb6d8;background:#fff;min-height:80px" onclick="document.querySelector(\'#jimages\').click()">拍照上传</button><div id="jpreviews" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px"></div>'+(isTrue?'<label for="junit">处理单位</label><input id="junit" placeholder="请输入处理单位"><label for="jconfirmer">处理确认人</label><select id="jconfirmer"><option value="">请选择处理确认人</option><option>当前登录人员</option><option>值守人员（演示）</option><option>巡检人员（演示）</option></select>':'')+'<p style="font-size:12px">带 * 为必填项。本页为演示填报，刷新后数据重置。</p><div style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #dce4ef;padding:14px 16px calc(14px + env(safe-area-inset-bottom));display:flex;gap:12px"><button type="button" style="flex:1" onclick="cancelJudgment()">取消</button><button type="submit" style="flex:2;background:'+(isTrue?'#bd2946':'#167854')+';color:white">提交'+(isTrue?'真警':'误报')+'</button></div></form>';window.scrollTo(0,0)}
function previewJudgmentImages(input){judgmentImages.forEach(x=>URL.revokeObjectURL(x.url));judgmentImages=Array.from(input.files).filter(f=>f.type.startsWith('image/')).map(f=>({name:f.name,url:URL.createObjectURL(f)}));const container=document.querySelector('#jpreviews');container.replaceChildren();judgmentImages.forEach(x=>{const image=document.createElement('img');image.src=x.url;image.alt=x.name;image.style.cssText='width:86px;height:86px;object-fit:cover;border-radius:8px';container.append(image)})}
function cancelJudgment(){const c=judgmentContext;judgmentImages.forEach(x=>URL.revokeObjectURL(x.url));judgmentImages=[];if(c.fromDetail){renderEvidence()}else{backToList()}window.scrollTo(0,0)}
function submitJudgment(){const form=document.querySelector('#judgmentForm');if(!form.reportValidity())return;const situation=document.querySelector('#jsituation');if(!situation.value.trim()){situation.setCustomValidity('请填写核查情况及判定依据');situation.reportValidity();situation.oninput=()=>situation.setCustomValidity('');return}const c=judgmentContext,d=realtime[c.id];d.status=c.isTrue?'已判真警':'已判误报';d.judgment={type:c.isTrue?'真警':'误报',time:document.querySelector('#jtime').value,place:document.querySelector('#jplace').value,content:document.querySelector('#jcontent').value,method:form.querySelector('[name="method"]:checked').value,situation:situation.value.trim(),recorder:document.querySelector('#jrecorder').value,attachments:judgmentImages.map(x=>x.name),...(c.isTrue?{handlingUnit:form.querySelector('#junit').value.trim(),confirmedBy:form.querySelector('#jconfirmer').value}:{})};cancelJudgment();toast('已提交'+(c.isTrue?'真警':'误报')+'填报')}
let completionId=null,completionPhotos=[];
function localCompletionTime(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date()).replace(' ','T')}
completeItem=function(id){completionId=id;completionPhotos=[];app.innerHTML='<header><div class="head" style="padding-bottom:16px"><strong>确认处理完成</strong><button aria-label="关闭填报" onclick="cancelCompletion()">关闭</button></div></header><form id="completionForm" class="screen" style="padding-top:0;padding-bottom:120px" onsubmit="event.preventDefault();submitCompletion()"><p>'+escapeText(closed[id].x[0])+'</p><label for="completionReason">报警原因 <span style="color:#bd2946">*</span></label><textarea id="completionReason" required maxlength="2000" placeholder="请输入报警原因" class="completion-text"></textarea><label for="completionResult">问题处理完成结果 <span style="color:#bd2946">*</span></label><textarea id="completionResult" required maxlength="2000" placeholder="请输入问题处理完成结果" class="completion-text"></textarea><label for="completionTime">问题处理完成时间 <span style="color:#bd2946">*</span></label><input id="completionTime" type="datetime-local" step="1" required value="'+localCompletionTime()+'"><label for="completionUnit">处理单位 <span style="color:#bd2946">*</span></label><input id="completionUnit" required placeholder="请输入处理单位"><label for="completionPerson">处理确认人 <span style="color:#bd2946">*</span></label><select id="completionPerson" required><option value="">请选择处理确认人</option><option>当前登录人员</option><option>值守人员（演示）</option><option>巡检人员（演示）</option></select><label for="completionFiles">附件图片</label><input id="completionFiles" type="file" accept="image/*" multiple style="display:none" onchange="previewCompletionPhotos(this)"><button type="button" onclick="document.querySelector(\' #completionFiles\'.trim()).click()">选择图片</button><div id="completionPreview" style="display:flex;flex-wrap:wrap;gap:10px;margin-top:12px"></div><p style="font-size:12px">带 * 为必填项。演示数据刷新后重置。</p><div style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:white;border-top:1px solid #dce4ef;padding:14px 16px calc(14px + env(safe-area-inset-bottom));display:flex;gap:12px"><button type="button" style="flex:1" onclick="cancelCompletion()">取消</button><button class="primary" type="submit" style="flex:2">确认提交</button></div></form>';window.scrollTo(0,0)};
function previewCompletionPhotos(input){completionPhotos.forEach(x=>URL.revokeObjectURL(x.url));completionPhotos=Array.from(input.files).filter(f=>f.type.startsWith('image/')).map(f=>({name:f.name,url:URL.createObjectURL(f)}));const box=document.querySelector('#completionPreview');box.replaceChildren();completionPhotos.forEach(x=>{const img=document.createElement('img');img.src=x.url;img.alt=x.name;img.style.cssText='width:86px;height:86px;object-fit:cover;border-radius:8px';box.append(img)})}
function cancelCompletion(){completionPhotos.forEach(x=>URL.revokeObjectURL(x.url));completionPhotos=[];backToList();window.scrollTo(0,0)}
function submitCompletion(){const form=document.querySelector('#completionForm');if(!form.reportValidity())return;for(const id of ['completionReason','completionResult','completionUnit']){const field=document.getElementById(id);if(!field.value.trim()){field.setCustomValidity('请填写此项，不能仅输入空格');field.reportValidity();field.oninput=()=>field.setCustomValidity('');return}}const d=closed[completionId];d.completion={reason:document.querySelector('#completionReason').value.trim(),result:document.querySelector('#completionResult').value.trim(),time:document.querySelector('#completionTime').value,unit:document.querySelector('#completionUnit').value.trim(),person:document.querySelector('#completionPerson').value,attachments:completionPhotos.map(x=>x.name)};d.status='处理完成';d.person=d.completion.person;cancelCompletion();toast('已提交，事件处理完成')}
let closureId=0,closureTab=0;
details=function(id){closureId=id;closureTab=0;renderClosureDetail();window.scrollTo(0,0)};
function closureGrid(items){return '<div class="basic-grid">'+items.map(v=>'<div><div class="field-label">'+escapeText(v[0])+'</div><div class="field-value">'+escapeText(v[1])+'</div></div>').join('')+'</div>'}
function closureNode(title,items){return '<section class="timeline-node"><h3>'+escapeText(title)+'</h3><dl>'+items.map(v=>'<dt>'+escapeText(v[0])+'</dt><dd>'+escapeText(v[1])+'</dd>').join('')+'</dl></section>'}
function renderClosureDetail(){const d=closed[closureId],isLevel=closureId===0,part=isLevel?'T41402B':'T41402A',point=isLevel?'T-102罐底阀组':'T-101罐底出料阀组';app.innerHTML='<header><div class="head"><button onclick="backToList()">〈 返回列表</button><strong style="font-size:18px">处理事件详情</strong><span></span></div><div style="padding:18px 0 4px"><div class="row"><span class="badge">'+d.x[2]+'报警</span><span class="badge '+(d.status==='处理完成'?'green':'')+'">'+d.status+'</span></div><h2>'+d.x[0]+'</h2><div class="time">'+d.time+'</div></div><div class="tabs" style="gap:8px">'+['报警信息','处置记录','巡查对象信息'].map((n,i)=>'<button style="font-size:13px" class="'+(closureTab===i?'active':'')+'" onclick="closureTab='+i+';renderClosureDetail()">'+n+'</button>').join('')+'</div></header><section id="closureContent" style="padding:18px 0 30px"></section>';let html='';if(closureTab===0){html='<article class="card"><h2 style="margin-top:0">报警基本信息</h2>'+closureGrid([['巡查对象名称',d.x[1]],['所属部位',part],['报警来源',d.x[7]],['报警时间',d.time],['监测项',d.x[4]],['报警值',d.x[5]],['触发阈值',d.x[6]],['报警档位 / 报警等级',d.x[3]+' / '+d.x[2]]])+'</article><article class="card"><h2 style="margin-top:0">报警前后趋势</h2><p style="font-size:12px">触发阈值：'+d.x[6]+'</p>'+deviceChart(d.x[4],d.x[5].replace(/[0-9. ]/g,'')).replace('10:10:33',isLevel?'09:30:21':d.time.slice(11)).replace('10:20:33',d.time.slice(11))+'<div class="note" style="padding-bottom:0">演示趋势数据</div></article>'}else if(closureTab===1){let nodes=closureNode('报警产生',[['报警（误报）时间',d.time],['报警（误报）地点',point+' · '+d.x[1]],['报警（误报）内容',d.x[0]],['监测项',d.x[4]],['报警等级',d.x[2]],['报警值',d.x[5]],['报警来源',d.x[7]]]);nodes+=closureNode('机器人核查',[['核查下发时间',d.time],['现场复核任务','FC-POINT-EVIDENCE-DEMO-BJ2026110400'+(closureId+4)],['操作人','未记录']]);nodes+=closureNode('机器人核查结果',[['核查开始时间',d.time],['核查结束时间',d.time],['核查状态','完成'],['现场复核任务','FC-POINT-EVIDENCE-DEMO-BJ2026110400'+(closureId+4)],['核查巡检点','1'],['告警数量','0']]);nodes+=closureNode('提交核查结果',[['提交时间',d.time],['核查结果','真警'],['核查方式','未记录'],['报警信息核查情况',isLevel?'核对就地液位与DCS趋势，确认液位异常。':'核对现场监测信息与设备趋势，确认报警异常。'],['记录人','值守人员'],['图片','暂无图片'],['处理人','未记录'],['处理人单位','未记录']]);nodes+=closureNode('通知罐区工艺工程师',[['通知时间',d.time],['通知人员','仲晓刚（演示）']]);if(d.completion){const c=d.completion;nodes+=closureNode('处理完成',[['报警原因',c.reason],['问题处理完成结果',c.result],['问题处理完成时间',c.time.replace('T',' ')],['处理单位',c.unit],['处理确认人',c.person],['附件图片',c.attachments.length?c.attachments.join('、'):'暂无图片']])}else if(d.status==='处理完成'){nodes+=closureNode('处理完成',[['处理确认人',d.person],['处理结果','演示记录，暂无详细填报信息']])}html='<article class="card"><h2 style="margin-top:0">处置记录</h2><div class="verification-timeline">'+nodes+'</div><div class="time">历史核查及通知信息为演示数据</div></article>'}else{html='<article class="card"><h2 style="margin-top:0">巡查对象信息</h2>'+closureGrid([['报警编号','BJ2026110400'+(closureId+4)],['巡查对象编号',isLevel?'DCS-LT102':d.x[1]],['报警设备名称',isLevel?'LT-102储罐液位采集设备':d.x[4]+'监测设备'],['设备编号',isLevel?'DEV-DCS-LT102':'DEV-'+d.x[1]],['所属罐区','丙烯罐区'],['罐区编号','—'],['罐体编号',part],['所属巡检点',point],['巡检点编号',isLevel?'PT-102':'PT-101'],['具体位置','丙烯罐区 '+part.slice(1)+' 西北角 0 米']])+'<p style="font-size:12px">对象档案为演示数据</p></article>'}document.querySelector('#closureContent').innerHTML=html}
launch();
</script></html>
