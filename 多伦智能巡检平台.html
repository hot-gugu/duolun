<main class="main"><div class="breadcrumb"><span>智能巡检</span><span>/</span><span>设备管理</span><span>/</span><span style="color:#24344d">监测设备管理</span></div><section class="panel" v-if="!controlDevice"><div class="page-head"><div><h1>监测设备管理</h1><p>统一查看设备档案、运行状态及关联巡查对象</p></div><div class="actions"><button v-if="menu!=='ledger'" class="soft" @click="paused=!paused">{{paused?'继续更新':'暂停更新'}}</button><button v-if="menu==='monitor'" class="soft" @click="refresh">↻ 读取数据</button><button v-if="menu!=='ledger'" class="primary" @click="exportData">↓ {{selected.size?'导出所选':'批量导出'}}</button></div></div>
<div class="stats"><button class="stat" :class="{active:metric==='all'}" @click="metric='all';page=1"><span class="stat-icon"><icon name="archive"/></span><span><span class="stat-title">主设备总数</span><span class="stat-num">{{roots.length}}<small>台</small></span></span></button><button class="stat" style="--accent:#12a36a" :class="{active:metric==='online'}" @click="metric='online';page=1"><span class="stat-icon"><icon name="check"/></span><span><span class="stat-title">在线主设备</span><span class="stat-num">{{onlineCount}}<small>台</small></span></span></button><button class="stat" style="--accent:#ef2f4f" :class="{active:metric==='fault'}" @click="metric='fault';page=1"><span class="stat-icon"><icon name="alert"/></span><span><span class="stat-title">异常主设备</span><span class="stat-num">{{faultCount}}<small>台</small></span></span></button><button class="stat" style="--accent:#d98600" :class="{active:metric==='offline'}" @click="metric='offline';page=1"><span class="stat-icon"><icon name="pulse"/></span><span><span class="stat-title">离线设备</span><span class="stat-num">{{roots.length-onlineCount}}<small>台</small></span></span></button></div>
<div class="filter"><div class="field"><label>设备类型</label><n-select style="width:160px" v-model:value="type" :options="typeOptions" placeholder="全部类型" clearable to="body" :consistent-menu-width="true" @update:value="page=1"/></div><div class="field"><label>所属罐区</label><n-select style="width:138px" v-model:value="region" :options="regionOptions" placeholder="全部区域" clearable to="body" @update:value="page=1"/></div><div class="field"><label>设备状态</label><n-select style="width:120px" v-model:value="status" :options="statusOptions" placeholder="全部状态" clearable to="body" @update:value="page=1"/></div><n-input class="search" v-model:value="keyword" placeholder="搜索设备、巡检点或巡查对象名称及编号" clearable @update:value="page=1"/><button class="soft" @click="reset">重置</button></div>
<div class="table-card"><div class="list-head"><div><span class="list-title">{{archive?'归档设备':'设备列表'}}</span><span class="list-count">共 {{filtered.length}} 台主设备<span v-if="selected.size"> · 已选 {{selected.size}} 项</span></span></div><div class="legend" v-if="menu==='monitor'"><span><i class="dot"></i>{{paused?'已暂停更新':'每5秒更新'}}</span><span>{{sampleTime}}</span></div><button v-else class="primary" @click="exportData">↓ {{selected.size?'导出所选':'批量导出'}}</button></div><div class="table-scroll"><table v-if="rows.length" class="unified-device-table"><thead><tr><th><n-checkbox :checked="rows.length>0&&rows.every(d=>selected.has(d.id))" :indeterminate="rows.some(d=>selected.has(d.id))&&!rows.every(d=>selected.has(d.id))" @update:checked="v=>rows.forEach(d=>check(d.id,v))"/></th><th>设备编号</th><th>设备名称</th><th>设备类型</th><th>在线状态</th><th>运行状态</th><th>所属主设备</th><th>所属罐区</th><th>所属部位</th><th>关联巡检点数量</th><th>关联巡查对象数量</th><th>最近上报时间</th><th>操作</th></tr></thead><tbody><tr v-for="d in rows" :key="d.id" :class="{child:d.parentId,'device-parent-row':d.children?.length}"><td><div class="device-tree-select"><button v-if="d.children?.length" class="group-toggle" :aria-label="(rows.some(c=>c.parentId===d.id)?'收起':'展开')+d.name" :aria-expanded="rows.some(c=>c.parentId===d.id)" @click="toggle(d.id)">{{rows.some(c=>c.parentId===d.id)?'⌄':'›'}}</button><span v-else class="device-tree-spacer"></span><n-checkbox :checked="selected.has(d.id)" @update:checked="v=>check(d.id,v)"/></div></td><td>{{d.id}}</td><td><div class="device-cell"><span class="device-icon"><icon :name="icon(d)"/></span><button class="device-link" @click="open(d)">{{d.name}}</button></div></td><td>{{d.type}}</td><td><span class="pill" :class="d.online?'green':'gray'">{{d.online?'在线':'离线'}}</span></td><td><span class="pill" :class="hasFault(d)?'orange':d.online?'green':'gray'">{{hasFault(d)?'异常':d.online?'正常':'未知'}}</span></td><td>{{get(d.parentId)?.name||'—'}}<span v-if="d.parentId" class="subtext">{{d.parentId}}</span></td><td>{{deviceScope(d,'tankArea')}}</td><td>{{deviceScope(d,'tankName')}}<span class="subtext">{{deviceScope(d,'tankId')}}</span></td><td><button v-if="devicePatrols(d).length" class="device-link" @click="showLinks(d)">{{devicePatrols(d).length}} 个</button><span v-else>0 个</span></td><td><button class="device-link" @click="showLinks(d)">{{deviceLinks(d).length}} 个</button></td><td>{{readings(d)[0]?.time||'—'}}</td><td><div class="row-actions"><button class="row-btn" @click="open(d)">详情</button><button v-if="!archive" class="row-btn" @click="startEdit(d)">编辑</button></div></td></tr></tbody></table><div v-else class="empty"><img src="assets/empty.svg" alt=""><p>暂无符合条件的设备</p><small>请调整筛选条件后重试</small><div style="margin-top:16px"><button class="soft" @click="reset">清空筛选</button></div></div></div><div class="pagination"><span>共 {{filtered.length}} 台主设备</span><n-pagination v-model:page="page" v-model:page-size="pageSize" :item-count="filtered.length" :page-sizes="[10,20,50]" show-size-picker @update:page-size="page=1"/></div></div></section><section v-else class="panel control-workspace"><div class="page-head"><div><div class="control-breadcrumb"><button class="device-link" @click="returnMonitor">← 返回设备列表</button></div><h1>{{targetType(controlDevice)}} · {{controlDevice.name}}</h1><p>{{controlDevice.location}}　｜　{{controlDevice.id}}</p></div><div class="actions"><span class="pill" :class="controlDevice.online?'green':'gray'">{{controlDevice.online?'在线':'离线'}}</span><button class="soft" @click="openData(controlDevice)">监测数据</button></div></div><div class="control-layout"><div class="video-column"><div class="video-shell"><div class="video-heading"><span>{{controlMode}}通道</span><span>监控画面 · 未连接视频流</span></div><div class="scene" :class="{playing,thermal:controlMode!=='可见光'}"><img src="assets/tank-scene.svg" alt="丙烯罐区示意画面" :style="{transform:'scale('+zoom+') translate('+(-yaw*.4)+'px,'+(pitch*.4)+'px)'}"><div v-if="playing" class="scene-scan"></div><div v-if="playing&&controlMode==='气云'" class="gas-cloud"></div><div v-if="!playing" class="video-placeholder"><icon name="camera"/><span>{{controlDevice.online?'尚未播放':'设备离线'}}</span><button class="primary" :disabled="!controlDevice.online" @click="playing=true">播放监控画面</button></div><div class="scene-label">{{playing?sampleTime:'示意场景'}}　{{controlMode}}</div></div><div class="video-controls"><div class="actions"><button class="soft" :disabled="!controlDevice.online" @click="playing=!playing">{{playing?'暂停播放':'在线播放'}}</button><button class="soft" @click="capture">抓拍</button></div><n-select v-model:value="controlMode" style="width:150px" :options="controlDevice.type.includes('OGI')?[{label:'可见光通道',value:'可见光'},{label:'气云通道',value:'气云'}]:controlDevice.type==='巡检机器人'?[{label:'可见光通道',value:'可见光'},{label:'热像通道',value:'热像'}]:[{label:'可见光通道',value:'可见光'}]" to="body"/></div></div><div class="surface control-readings"><div class="monitor-toolbar"><h3 class="section-title" style="margin:0">当前监测数据</h3><button class="soft" @click="refresh">读取数据</button></div><div class="reading-grid"><div class="reading-card" v-for="r in readings(controlDevice)"><span class="reading-label">{{r.label}}</span><div class="reading-value" :class="{stale:!r.valid}">{{r.value}}<small>{{r.unit}}</small></div><span class="subtext">{{r.valid?'有效':'已失效'}} · {{r.available===false?'—':r.time.split(' ')[1]}}</span></div></div></div></div><div class="control-right"><div class="surface"><h3 class="section-title">云台控制</h3><div class="ptz-grid"><span></span><button class="soft" aria-label="云台上转" @click="command('云台上转')">↑</button><span></span><button class="soft" aria-label="云台左转" @click="command('云台左转')">←</button><button class="soft" aria-label="停止云台" @click="command('停止云台')">停</button><button class="soft" aria-label="云台右转" @click="command('云台右转')">→</button><span></span><button class="soft" aria-label="云台下转" @click="command('云台下转')">↓</button><span></span></div><div class="ptz-data"><span>水平 {{yaw}}°</span><span>俯仰 {{pitch}}°</span></div><div class="actions" style="justify-content:center"><button class="soft" @click="command('缩小')">－</button><span>{{zoom}}×</span><button class="soft" @click="command('放大')">＋</button></div><span class="subtext" style="text-align:center;margin-top:15px">操控</span></div><div class="surface" v-if="controlDevice.type==='巡检机器人'"><h3 class="section-title">机器人运动控制</h3><div class="ptz-grid"><span></span><button class="soft" @click="command('前进')">前进</button><span></span><button class="soft" @click="command('左转')">左转</button><button class="soft" @click="command('停止运动')">停止</button><button class="soft" @click="command('右转')">右转</button><span></span><button class="soft" @click="command('后退')">后退</button><span></span></div><span class="subtext">{{lastCommand||'暂无操作记录'}}</span></div><div class="surface"><h3 class="section-title">异常与历史</h3><div class="shortcut" @click="openData(controlDevice,'监测曲线')" role="button" tabindex="0" @keydown.enter="openData(controlDevice,'监测曲线')"><icon name="pulse"/><span>监测曲线</span><span>›</span></div><div class="shortcut" @click="openData(controlDevice,'异常记录')" role="button" tabindex="0" @keydown.enter="openData(controlDevice,'异常记录')"><icon name="alert"/><span>异常记录</span><span>{{eventsFor(controlDevice).length}} 条 ›</span></div><span class="subtext" v-if="lastCommand&&controlDevice.type!=='巡检机器人'">{{lastCommand}}</span><span class="subtext" v-if="captureCount">已抓拍 {{captureCount}} 次</span></div></div></div></section></main></div>
<n-drawer :show="drawer" :width="780" placement="right" :mask-closable="false" @update:show="v=>{if(!v)close()}"><n-drawer-content :title="editing?'编辑设备档案':'设备详情'" :native-scrollbar="false"><template #header><div style="display:flex;width:100%;align-items:center;justify-content:space-between"><span>{{editing?'编辑设备档案':'设备详情'}}</span><button class="soft" style="height:30px;border:0;font-size:20px;padding:0 8px" aria-label="关闭抽屉" @click="close">×</button></div></template><div class="drawer-layout unified-device-drawer" v-if="current"><div class="drawer-top"><div class="drawer-device"><span class="device-icon" style="width:46px;height:46px"><icon :name="icon(current)"/></span><div><h2>{{current.name}}</h2><span class="subtext">{{current.id}}　｜　{{current.type}}</span></div><div class="drawer-status"><span class="pill" :class="current.online?'green':'gray'">{{current.online?'在线':'离线'}}</span> <span v-if="[current,...current.children||[]].some(d=>(d.faultHistory||[]).some(e=>e.status==='未恢复'))" class="pill orange">设备异常</span></div></div><div class="drawer-meta"><span>{{current.location}}</span><button v-if="current.parentId" class="device-link" style="color:#0879ff;font-size:12px" @click="menu==='monitor'?openData(get(current.parentId)):open(get(current.parentId))">所属主设备：{{get(current.parentId).name}} ↗</button></div></div>
<div class="tab-group"><button v-for="t in (editing?['基础档案','安装与覆盖','接入信息','资产与维保']:tabs.filter(t=>(!isCamera(current)||t!=='监测曲线')&&(t!=='设备控制'||isSound(current))))" class="tab" :class="{active:tab===t}" @click="tab=t">{{isCamera(current)&&t==='实时读数'?'视频预览':t}}</button></div><div class="tab-content">
<template v-if="tab==='关联点位'"><h3 class="section-title">{{isSound(current)?'报警联动巡查对象':'位置与巡查对象关联'}}</h3><div class="surface"><span class="info-label">{{isMobile(current)?'当前所在位置':'安装位置'}}</span><p>{{currentDevicePosition(current)}}</p></div><div class="table-scroll"><table><thead><tr><th>所属罐区</th><th>所属部位</th><th>巡检点名称 / 编号</th><th>巡查对象名称 / 编号</th><th>具体位置</th></tr></thead><tbody><template v-for="m in deviceLinks(current)" :key="m.id"><tr v-for="p in linkedPointsForMonitor(m.id)" :key="p?.id||m.id"><td>{{m.tankArea||'—'}}<span class="subtext">{{m.tankAreaCode||'未同步编号'}}</span></td><td>{{m.tankName||'—'}}<span class="subtext">{{m.tankId||'未同步编号'}}</span></td><td>{{p?.name||'未关联'}}<span class="subtext">{{p?.id||'—'}}</span></td><td>{{m.name}}<span class="subtext">{{m.id}}</span></td><td>{{m.location||'—'}}</td></tr></template></tbody></table></div><div v-if="!deviceLinks(current).length" class="empty"><img src="assets/empty.svg" alt=""><p>暂无关联巡查对象</p></div></template><template v-else-if="tab==='实时读数'"><template v-if="isSound(current)"><div class="empty"><img src="assets/empty.svg" alt=""><p>该设备无数值采集项</p></div></template><template v-else-if="isCamera(current)"><section class="device-camera-player"><header><span>{{current.name}}</span><button class="row-btn" @click="cameraModal=true">放大查看</button></header><div class="device-camera-stage"><video v-if="cameraPlaying&&cameraUrl&&!cameraModal&&!cameraError" :src="cameraUrl" :poster="current.previewUrl||'assets/propylene-tanks.jpg'" autoplay controls playsinline @error="cameraError=true"></video><template v-else><img :src="current.previewUrl||'assets/propylene-tanks.jpg'" alt="工业现场预览示意"><div v-if="!cameraPlaying||cameraError" class="device-camera-overlay"><span>{{cameraError?'视频加载失败':current.online?'点击播放视频':'设备离线'}}</span><button v-if="current.online" class="primary" @click="startCamera">{{cameraError?'重试':'播放'}}</button></div><span v-else class="device-camera-demo">演示画面 · 未连接视频流</span></template></div><footer><span>{{current.id}}</span><button v-if="cameraPlaying" class="soft" @click="cameraPlaying=false">停止播放</button></footer></section></template><template v-else>
<div class="monitor-toolbar"><span class="status-note">采集时间：{{valid(current)?sampleTime:'2026-11-04 10:16:42'}}</span><div class="actions"><span class="pill" :class="valid(current)?'green':'gray'">{{valid(current)?'数据有效':'数据已失效'}}</span><button class="soft" @click="refresh">读取数据</button></div></div>
<div class="reading-grid" v-if="readings(current).length"><div class="reading-card" v-for="r in readings(current)" :key="r.key"><span class="reading-label">{{r.label}}</span><div class="reading-value" :class="{stale:!r.valid}">{{r.value}}<small>{{r.unit}}</small></div><span class="subtext">{{r.valid?'最新采集':'最后有效值'}} · {{r.available===false?'—':r.time.split(' ')[1]}}</span></div></div>
<div v-else class="empty"><img src="assets/empty.svg" alt=""><p>暂无数值监测项</p><small>此设备仅提供运行状态</small></div>
<div class="surface"><div class="info-grid"><div class="info-item"><span class="info-label">当前工作状态</span><span class="info-value">{{current.work}}</span></div><div class="info-item"><span class="info-label">当前巡检任务</span><span class="info-value">{{current.type==='巡检机器人'?'丙烯罐区日常巡检':'—'}}</span></div><div class="info-item"><span class="info-label">{{isMobile(current)?'当前所在位置':'安装位置'}}</span><span class="info-value">{{currentDevicePosition(current)}}</span></div><div class="info-item"><span class="info-label">数据来源</span><span class="info-value">{{current.parentId?'机器人挂载采集':current.type.includes('OGI')?'气云设备采集':'设备采集'}}</span></div></div></div>
<div v-if="targetType(current)" class="workspace-entry"><div><h3>{{targetType(current)}}</h3><span> {{current.name}} </span></div><button class="primary" @click="enterWorkspace(current)">进入{{targetType(current)}} ↗</button></div>
<template v-if="current.children&&current.children.length"><h3 class="section-title">挂载设备实时数据</h3><div class="attachment-reading" v-for="c in current.children"><div><button class="device-link" @click="openData(c)">{{c.name}} ↗</button><span class="subtext">{{summary(c)}}</span></div><span class="pill" :class="valid(c)?'green':'gray'">{{valid(c)?'有效':'已失效'}}</span></div></template>
</template></template>
<template v-else-if="tab==='设备控制'&&isSound(current)"><h3 class="section-title">声光报警控制</h3><div class="actions" style="margin:16px 0 24px"><button class="primary" :disabled="!current.online||soundResponse(current)==='模拟开启'" @click="soundControl(true)">开启声光报警</button><button class="soft" :disabled="!current.online||soundResponse(current)==='模拟关闭'" @click="soundControl(false)">关闭声光报警</button></div><h3 class="section-title">当前联动报警</h3><div v-for="a in soundAlarms(current)" :key="a.id" class="record"><p>{{a.name}} · {{a.level}}</p><small>{{a.monitor}} · {{a.id}} · {{a.time}}</small></div><div v-if="!soundAlarms(current).length" class="empty"><img src="assets/empty.svg" alt=""><p>当前无联动报警</p></div></template><template v-else-if="tab==='监测曲线'"><template v-if="isSound(current)"><div class="empty"><img src="assets/empty.svg" alt=""><p>该设备无监测曲线</p></div></template><template v-else><div class="monitor-toolbar"><n-select v-model:value="curveKey" :options="curveOptions" :placeholder="curveOptions[0]?.label||'暂无监测项'" style="width:240px" to="body"/><n-select v-model:value="range" :options="[{label:'近1小时',value:'1h'},{label:'近6小时',value:'6h'},{label:'近24小时',value:'24h'}]" style="width:130px" to="body"/></div>
<template v-if="curve"><div class="chart-card"><div class="chart-title"><span>{{curve.label}}</span><span class="status-note">{{curve.unit}}</span></div><svg class="trend-chart" viewBox="0 0 670 265" role="img" :aria-label="curve.label+'监测曲线'"><g v-for="t in curve.ticks"><line x1="54" x2="624" :y1="t.y" :y2="t.y" stroke="#e7eef8"/><text x="42" :y="t.y+4" text-anchor="end">{{t.label}}</text></g><g v-for="l in curve.labels"><text :x="l.x" y="240" text-anchor="middle">{{l.label}}</text></g><path :d="curve.path" fill="none" stroke="#0879ff" stroke-width="2"/><circle v-for="(pt,i) in curve.points" :key="i" :cx="pt.x" :cy="pt.y" r="3" fill="#0879ff"><title>{{new Date(pt.time).toLocaleTimeString('zh-CN')}} · {{pt.value}} {{curve.unit}}</title></circle></svg><div v-if="!valid(current)" class="stale chart-note">断传后不补绘数据，曲线仅保留最后有效采样。</div></div><div class="status-cards"><div class="status-box"><small>最高值</small><strong>{{curve.max}} <small class="inline-unit">{{curve.unit}}</small></strong></div><div class="status-box"><small>最低值</small><strong>{{curve.min}} <small class="inline-unit">{{curve.unit}}</small></strong></div><div class="status-box"><small>平均值</small><strong>{{curve.avg}} <small class="inline-unit">{{curve.unit}}</small></strong></div></div></template><div v-else class="empty"><img src="assets/empty.svg" alt=""><p>暂无监测曲线</p><small>该设备暂无可展示的数值采样</small></div></template></template>
<template v-else-if="tab==='异常记录'"><div class="monitor-toolbar"><n-select v-model:value="eventStatus" :options="eventStatuses" clearable placeholder="全部恢复状态" style="width:190px" to="body"/><span class="status-note">共 {{filteredEvents.length}} 条</span></div><div v-if="filteredEvents.length" class="event-list device-fault-records"><article v-for="e in filteredEvents" :key="e.category+e.id" class="event-card"><div class="event-card-head"><span class="pill">{{e.category}}</span><span class="pill" :class="e.status==='已恢复'?'green':'orange'">{{e.status}}</span></div><h3 class="device-fault-type" aria-label="报警类型">{{e.name}}</h3><div class="info-grid"><div v-for="f in e.fields" :key="f[0]" class="info-item"><span class="info-label">{{f[0]}}</span><span :class="f[0]==='报警等级'?'device-fault-level device-fault-level--'+(e.level==='一级'?'red':e.level==='二级'?'orange':'blue'):''">{{f[1]}}</span></div></div></article></div><div v-else class="empty"><img src="assets/empty.svg" alt=""><p>暂无异常记录</p></div></template>

tle\">执行安排与记录</h3><div class=\"tab-group\"><button v-for=\"tab in ['执行记录','后续执行安排']\" :key=\"tab\" class=\"tab\" :class=\"{active:planRecordTab===tab}\" @click=\"planRecordTab=tab\">{{tab}}</button></div><div class=\"plan-detail-filters plan-record-filters\"><n-date-picker v-model:value=\"planRecordRange\" type=\"datetimerange\" clearable to=\"body\"/><n-select v-if=\"planRecordTab==='执行记录'\" v-model:value=\"planRecordStatus\" :options=\"opts(['正在执行','任务暂停','执行完成','中途终止'])\" placeholder=\"全部任务状态\" clearable to=\"body\"/></div><div class=\"table-scroll plan-record-table\" :class=\"{'plan-record-has-actions':planRecordTab==='执行记录'}\"><table><thead><tr><th>{{planRecordTab==='执行记录'?'任务编号':'执行安排'}}</th><th>计划执行时间</th><th>{{planRecordTab==='执行记录'?'任务状态':'生成状态'}}</th><th v-if=\"planRecordTab==='执行记录'\">执行进度</th><th v-if=\"planRecordTab==='执行记录'\">操作</th></tr></thead><tbody><tr v-for=\"task in planRecordData.rows\" :key=\"task.id\"><td>{{task.state==='待生成'?'计划预览':task.id}}</td><td>{{task.date}} {{task.time}}</td><td>{{planRecordTab==='执行记录'?taskStateLabel(task):task.state==='待生成'?'待生成':'已生成'}}</td><td v-if=\"planRecordTab==='执行记录'\">{{task.progress}}%</td><td v-if=\"planRecordTab==='执行记录'\"><button v-if=\"isDone(task)\" class=\"row-btn\" @click=\"locateExecutionTask(task)\">查看任务</button><span v-else>—</span></td></tr></tbody></table><div v-if=\"!planRecordData.total\" class=\"empty\"><img src=\"assets/empty.svg\" alt=\"\"><p>暂无符合条件的{{planRecordTab}}</p></div></div><div class=\"pagination plan-record-pagination\"><span>共 {{planRecordData.total}} 条</span><n-pagination v-model:page=\"planRecordPage\" v-model:page-size=\"planRecordSize\" :item-count=\"planRecordData.total\" :page-sizes=\"[20,50,100]\" show-size-picker/></div></template></template><template #footer><button class=\"soft\" @click=\"planManageDetail=null;pendingTaskDetailId=null\">关闭</button></template></n-drawer-content></n-drawer><n-drawer v-model:show=\"humanDrawer.show\" :width=\"620\" placement=\"right\"><n-drawer-content :title=\"humanDrawer.feedback?'填写人工核查反馈':'人工现场核查'\" closable><n-form class=\"human-check-form\" label-placement=\"top\"><n-form-item v-for=\"f in humanInfo(humanAlarm)\" :key=\"f[0]\" :label=\"f[0]\"><n-input :value=\"String(f[1])\" readonly type=\"textarea\" autosize/></n-form-item><template v-if=\"!humanDrawer.feedback\"><n-form-item label=\"现场核查人\" required><n-select v-model:value=\"humanDrawer.person\" :options=\"humanPeople\" placeholder=\"请选择当前班组人员\" to=\"body\"/></n-form-item></template><template v-else><n-form-item label=\"报警信息核查情况\" required><n-input v-model:value=\"humanDrawer.situation\" type=\"textarea\" :rows=\"3\"/></n-form-item><n-form-item label=\"反馈时间\" required><n-date-picker v-model:value=\"humanDrawer.time\" type=\"datetime\" to=\"body\"/></n-form-item><n-form-item label=\"反馈人\" required><n-select v-model:value=\"humanDrawer.person\" :options=\"humanPeople\" to=\"body\"/></n-form-item></template><n-form-item v-if=\"!humanDrawer.feedback\" label=\"备注\"><n-input v-model:value=\"humanDrawer.note\" type=\"textarea\" :rows=\"3\"/></n-form-item><n-form-item label=\"附件图片\"><n-upload :key=\"humanDrawer.id+'-'+humanDrawer.feedback+'-'+humanDrawer.show\" accept=\"image/*\" :default-upload=\"false\" multiple list-type=\"image-card\" @update:file-list=\"humanFiles\">选择图片</n-upload></n-form-item><n-form-item v-if=\"humanDrawer.feedback\" label=\"备注\"><n-input v-model:value=\"humanDrawer.note\" type=\"textarea\" :rows=\"3\"/></n-form-item><template v-if=\"humanDrawer.feedback\"><n-form-item label=\"核查结果\" required><div class=\"actions\"><button v-for=\"result in ['真警','误报']\" :key=\"result\" :class=\"humanDrawer.result===result?'primary':'soft'\" @click=\"humanDrawer.result=result;humanDrawer.owner=null;humanDrawer.ownerUnit=''\">{{result}}</button></div></n-form-item><n-form-item v-if=\"humanDrawer.result==='真警'\" label=\"处理人\" required><n-select v-model:value=\"humanDrawer.owner\" :options=\"humanPeople\" placeholder=\"请选择处理人\" to=\"body\"/></n-form-item><n-form-item v-if=\"humanDrawer.result==='真警'\" label=\"下发处理人单位\"><n-input v-model:value=\"humanDrawer.ownerUnit\" placeholder=\"请输入下发处理人单位\"/></n-form-item></template></n-form><template #footer><div class=\"actions\"><button class=\"soft\" @click=\"humanDrawer.show=false\">取消</button><button class=\"primary\" :disabled=\"humanDrawer.loading\" @click=\"submitHuman\">{{humanDrawer.loading?'图片读取中':humanDrawer.feedback?'提交':'下发核查'}}</button></div></template></n-drawer-content></n-drawer><notification-center-view :center=\"center\"/></div>\n"};
